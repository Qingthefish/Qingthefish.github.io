  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F7F4; --text: #1A1918; --muted: #8C8880;
      --light: #B8B4AE; --border: #E0DDD6; --border-light: #EDEAE4;

      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 400; line-height: 1.75; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 48px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 64px; background: rgba(248,247,244,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); }
    .nav-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-back { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .nav-back:hover { color: var(--text); }
    #lang-btn { font-size: 0.72rem; letter-spacing: 0.08em; background: none; border: 1px solid var(--border); padding: 5px 14px; cursor: pointer; color: var(--muted); transition: all 0.2s; border-radius: 2px; }
    #lang-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* HERO */
    .hero { padding: 140px 0 80px; border-bottom: 1px solid var(--border); }
    .hero-meta { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--light); margin-bottom: 28px; }
    .hero-title { font-family: var(--serif); font-size: clamp(3rem, 7vw, 6rem); font-weight: 300; line-height: 1.05; margin-bottom: 20px; }
    .hero-sub { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--muted); margin-bottom: 40px; }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--border); color: var(--muted); border-radius: 2px; }

    .stat { padding: 52px 40px; border-right: 1px solid var(--border-light); }
    .stat:last-child { border-right: none; }
    .stat-num { font-family: var(--serif); font-size: 3.2rem; font-weight: 300; line-height: 1; margin-bottom: 10px; }
    .stat-label { font-size: 0.75rem; color: var(--muted); line-height: 1.6; }

    section { padding: 80px 0; border-bottom: 1px solid var(--border); }
    .sec-label { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--light); margin-bottom: 48px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
    .two-col { display: grid; grid-template-columns: 300px 1fr; gap: 80px; align-items: start; }
    .col-head { font-family: var(--serif); font-size: 1.8rem; font-weight: 300; line-height: 1.3; }
    .col-body { font-size: 0.88rem; color: #635F5A; line-height: 1.9; }
    .col-body p + p { margin-top: 16px; }
    .col-body strong { color: var(--text); font-weight: 500; }

    /* CALLOUT */
    .callout { border-left: 2px solid var(--text); padding: 4px 0 4px 24px; margin-top: 40px; }
    .callout .big { font-family: var(--serif); font-size: 1.3rem; line-height: 1.45; color: var(--text); margin-bottom: 12px; }
    .callout p { font-size: 0.85rem; color: #4E4A45; line-height: 1.9; }
    .callout strong { color: var(--text); font-weight: 500; }
    .quote { border-left: 2px solid var(--border); padding-left: 22px; margin-top: 28px; font-family: var(--serif); font-size: 1.08rem; font-style: italic; color: #4E4A45; line-height: 1.7; }

    /* FIGURE */
    .fig { margin-top: 52px; }
    .fig img { width: 100%; display: block; border: 1px solid var(--border-light); background: #fff; }
    .fig figcaption { margin-top: 14px; font-size: 0.76rem; color: var(--muted); line-height: 1.75; }

    /* DIAGRAM */
    .diagram { margin-top: 52px; }
    .diagram svg { width: 100%; height: auto; display: block; }
    .diagram text { font-family: var(--sans); }
    .diagram text.dg-serif { font-family: var(--serif); }
    .dg-hint { display: none; font-size: 0.66rem; letter-spacing: 0.08em; color: var(--light); margin-bottom: 12px; }

    /* ROUNDS */
    .rounds { margin-top: 44px; border-top: 1px solid var(--border-light); }
    .round { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 34px; padding: 24px 0; border-bottom: 1px solid var(--border-light); align-items: start; }
    .round-n { font-family: var(--serif); font-size: 1.7rem; font-weight: 300; color: var(--light); line-height: 0.9; }
    .round-did { font-size: 0.84rem; color: var(--text); line-height: 1.8; }
    .round-got { font-size: 0.84rem; color: #706C67; line-height: 1.8; }

    /* BOUNDS */
    .bounds { margin-top: 44px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border-light); border: 1px solid var(--border-light); }
    .bound { background: var(--bg); padding: 26px 30px; }
    .bound-k { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--light); margin-bottom: 10px; }
    .bound-v { font-size: 0.83rem; color: #635F5A; line-height: 1.85; }
    .bound-v strong { color: var(--text); font-weight: 500; }

    /* FOOTER */
    .page-footer { padding: 56px 0; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; }
    .footer-back { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .footer-back:hover { color: var(--text); }
    .footer-copy { font-size: 0.7rem; color: var(--light); }

    @media (max-width: 840px) {
      .diagram { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .diagram svg { min-width: 1100px; }
      .dg-hint { display: block; }
      .container { padding: 0 24px; }
      .two-col, .stats, .bounds { grid-template-columns: 1fr; }
      .stat { border-right: none; border-bottom: 1px solid var(--border-light); padding: 36px 0; }
      .round { grid-template-columns: 1fr; gap: 8px; }
      .round-n { font-size: 1.2rem; }
      section { padding: 60px 0; }
    }
    ::selection { background: var(--text); color: var(--bg); }

<script>
const T = {
  "zh": {

    "sec3_p1": "组里已经有一份端到端与世界模型方向的文献库。我没有重复它，而是自己开了另一条线——<strong>从视觉里直接抽出结构化关系</strong>那一支。这条线在组里已有的材料里没有人覆盖过。",
    "sec3_p2": "第一个排除的是<strong>现成的高精地图</strong>。地图里的车道和拓扑本来就是结构化的，用了立刻省事。但我的判断是：<strong>那种结构是「给定」的，不是从感知里学出来的。</strong>直接用等于把结构当成输入，模型的一部分能力其实被替代掉了，也不符合端到端的方向。这是一次主动拒绝免费午餐。",
    "sec3_p3": "第二个排除的是<strong>传统的两阶段做法</strong>——先检测物体，再枚举所有物体对，再逐对分类关系。理由是物体对的数量随物体数平方增长，在驾驶场景下噪声大、流程碎。（两个月后我会因为忘掉这条判断而付出代价。）",
    "sec3_p4": "最后选基线时，我<strong>选了最容易跑通的那个，而不是最强的那个</strong>——这个阶段要买的不是性能，是「这条路到底走不走得通」这个信息。然后我把它亲手跑起来：改掉失效的权重下载、绕过新版框架的反序列化默认值、换掉被防盗链拦住的取图方式、修掉只有单条关系时绘图维度退化的报错。",
    "fig2_cap": "我跑通的开源场景图生成基线：上两行是模型定位主体与客体时的注意力分布，第三行是它预测出的「实体—关系—实体」三元组。这一步把「场景图」从论文名词变成了一条可以观察和实验的链路。",
    "sec5_label": "三轮实验 + 下一步方案",
    "sec5_head": "我以为是措辞问题，其实是题目问题",
    "sec5_p1": "要训练一个能预测关系的模型，得先有一批标好了关系的数据，而这种标签不存在。两条路：写规则（确定可控，但带意图的语义关系很难界定），或者让大模型看图直接标（语义是它的强项，一个提示词覆盖全部关系类型）。我先试后者——<strong>因为赌注只是改提示词，是最便宜的实验</strong>。我实际完成了三轮递进实验，随后提出一个尚未运行、也没有量化验证的下一步方案。",
    "r1d": "原始提示词，里面写了「全面覆盖场景中所有重要交互」。",
    "r1g": "能跑，但模型开始<strong>机械枚举</strong>：自车「驶入车道 1 / 车道 2 / 车道 3……」顺序往下。它把「全面覆盖」理解成了「尽量多输出」。",
    "r2d": "加严：不要枚举所有组合、不确定就别输出、每个参与者最多一到两条车道关系、总输出不超过三十条。",
    "r2g": "<strong>压不住。</strong>自车照样被塞进多条车道，车道之间照样大量互连，部分输出还被长度上限截断。当时我写的是：「已经证明，模型不听，或者说听不住。」",
    "r3d": "换个思路——给它完整的车道几何，信息更全，指望它判得准一点。",
    "r3g": "<strong>显存直接炸了。</strong>信息量和上下文长度之间有硬兑换比，这一头也堵死了。",
    "r4d": "下一步方案（未执行）：用代码先筛候选，只留离自车最近的八到十二个参与者；每个参与者只给最近的一两条候选车道；每条车道只给首、中、尾三个点。",
    "r4g": "这是三轮实验后形成的<strong>约束前移假设</strong>。当时没有完成系统运行和量化评测，因此这里只写成提案，不能写成已经改善的结果。",
    "fig1_cap": "当时喂给模型的输入长这样：一帧路口场景里，大量逐条标号的车道与交通参与者，标签密到糊成一团。这张图就是候选空间过大的根因判断来源。",
    "sec5_co_big": "问题不在措辞，在我给它的候选空间太大。",
    "sec5_co_p": "车道与交通参与者之间的组合会快速膨胀，而真正有效的关系只占很小一部分。我在提示词里写「不要枚举」，等于要求模型在一个过大的候选空间里靠自觉克制。这不是模型能力问题，<strong>是任务设计问题</strong>。正确做法是把选择权收回来：在数据构造阶段先筛掉明显无关的组合，让模型只看真正值得判断的候选。我把这个认知叫<strong>「约束前移」</strong>——不要在输出端求模型自律，要在输入端让错误无法发生。",
    "sec6_label": "最想讲透的一课",
    "sec6_head": "我写下了正确的预判，然后没有用它",
    "sec6_p1": "三月，我在自己的笔记里写下「它强依赖训练分布，迁到自动驾驶数据是个问题」。五月，我做的事是<strong>把一个通用大模型直接拿去标驾驶场景的关系</strong>。同一个机理的第二次发作，而我提前两个月就写下了它。",
    "sec6_p2": "为什么？我现在的答案是：<strong>写下判断和使用判断，是两个动作。</strong>我把笔记当成了「学习的产物」，而不是「决策的输入」。一条写在文档里、但不出现在下一次实验设计里的判断，等于没有。",
    "sec6_p3": "还有第二个错，更难承认：<strong>我全程没建评估基线。</strong>三轮实验主要靠人眼判断输出质量，所以即使第二轮的措辞更严格，也说不清它比第一轮好了多少。如果当时先定义「一个参与者平均被分配到几条车道」这类指标（它应该接近 1），就能更早看出加严措辞没有解决根因。",
    "sec6_p4": "这两个错我都在上一个项目的复盘里写过对应的教训，半年后原封不动又犯一遍。所以现在我有两条硬性自查：<strong>动一个新实验之前，先回去看自己关于它写过什么；进一个新环境的第一周，先问「我怎么知道自己做的东西变好了」，再动手。</strong>"
  },
  "en": {
    "dg_hint": "← swipe to see the full diagram →",
    "back": "Portfolio",
    "foot_back": "← Back to portfolio",
    "hero_meta": "Research · CASIA · Feb — May 2026",
    "hero_title": "Autonomous-driving scene modelling",
    "hero_sub": "Making \"who is doing what to whom\" an explicit prediction target",
    "s1n": "4 months",
    "s1": "February to May 2026 at the Institute of Automation, Chinese Academy of Sciences; February began with literature review and topic discussions",
    "s2n": "3 rounds",
    "s2": "of progressive experiments on direct scene-relation labelling, followed by one unvalidated constraint-first proposal.",
    "s3n": "1 root cause",
    "s3": "the problem was not prompt wording but the oversized candidate space given to the model",
    "sec1_label": "The work",
    "sec1_head": "Teaching a driving model what is happening between the things it sees",
    "sec1_p1": "End-to-end driving models usually map sensor input straight to control output, leaving scene understanding implicit. This work introduces an <strong>explicit scene graph</strong> — not just \"there is a car here\" but relations between entities, such as \"that car is merging into my lane\" — and feeds that structured understanding into the world model.",
    "sec1_p2": "Existing approaches either predict raw pixels — making textures and distant scenery, largely irrelevant to the driving decision, part of the prediction target — or compress everything into latent features, which is efficient but entangles entity identity with interaction, leaving the planner no relational evidence it can act on directly. <strong>Making relations themselves an explicit prediction target</strong> is the bet this work makes.",
    "dg_alt": "A comparison of three ways to represent a driving scene",
    "dg_a_t": "Predict pixels",
    "dg_a_c1": "The target is the whole frame — textures, distant",
    "dg_a_c2": "scenery, sky. Most of it never touches the decision.",
    "dg_b_t": "Compress to latent features",
    "dg_b_c1": "Efficient, but identity and interaction are entangled.",
    "dg_b_c2": "The planner gets no relational evidence it can use.",
    "dg_c_t": "Make relations explicit",
    "dg_c_c1": "Nodes keep decision-relevant entities, edges keep",
    "dg_c_c2": "their interactions — separately checkable, separately fixable.",
    "dg_n1": "ego",
    "dg_n2": "car",
    "dg_n3": "ped",
    "dg_e1": "follows",
    "dg_e2": "yields to",
    "dg_foot1": "An explicit relational structure is a natural information bottleneck.",
    "dg_foot2": "It does not just make the scene smaller — it turns \"what deserves to survive\" into a design decision you can argue about and verify.",
    "sec3_label": "First move",
    "sec3_head": "Opening a line of reading nobody else had walked",
    "sec3_p1": "The group already had a library of notes on end-to-end planning and world models. I did not duplicate it. I opened a different line instead — <strong>extracting structured relations directly from vision</strong>. Nothing in the group's existing material covered it.",
    "sec3_p2": "The first thing I ruled out was <strong>using the pre-built HD map</strong>. Its lanes and topology are already structured, and taking them would have saved real work. But my read was this: <strong>that structure is given, not learned from perception.</strong> Consuming it directly turns structure into an input and quietly substitutes for a capability the model is supposed to acquire — which is not what end-to-end is for. It was a deliberate refusal of a free lunch.",
    "sec3_p3": "The second thing I ruled out was <strong>the classic two-stage approach</strong> — detect objects, enumerate every object pair, then classify each pair. The number of pairs grows with the square of the object count, which in driving scenes means noise and a fragmented pipeline. (Two months later I would pay for forgetting this.)",
    "sec3_p4": "When it came to picking a baseline I <strong>chose the easiest one to get running, not the strongest</strong> — at that stage what you are buying is not performance, it is the answer to \"does this route go anywhere at all\". Then I got it running myself: replacing a dead weights download, working around a new deserialisation default in the framework, swapping out an image fetch that was being blocked, and fixing a plotting crash that only appeared when exactly one relation survived filtering.",
    "fig2_cap": "The open-source scene-graph baseline I got running. The top two rows show where the model attends when it localises the subject and object; the third shows the entity–relation–entity triples it predicted. This turned \"scene graph\" from a term in a paper into a pipeline I could observe and experiment with.",
    "sec5_label": "Three experiments + a proposal",
    "sec5_head": "I thought it was a wording problem. It was a task-design problem.",
    "sec5_p1": "Training a model to predict relations requires data with relations already labelled, and no such labels existed. Two options: write rules (deterministic and controllable, but intent-bearing relations are genuinely hard to define), or let a large model look at the scene and label it directly (semantics is its strength, and one prompt covers every relation type). I tried the second first — <strong>because the only stake was editing a prompt, which is the cheapest experiment available</strong>. I completed three progressive experiments, then proposed a next step that was neither run nor quantitatively validated.",
    "r1d": "The original prompt, which asked it to \"comprehensively cover all important interactions in the scene\".",
    "r1g": "It ran — and the model started <strong>enumerating mechanically</strong>: ego turning into lane 1, lane 2, lane 3, straight down the list. It had read \"cover comprehensively\" as \"emit as much as possible\".",
    "r2d": "Tighten the prompt: do not enumerate every pair, skip anything you are unsure about, at most one or two lane relations per agent, no more than thirty lines total.",
    "r2g": "<strong>It did not hold.</strong> Ego still landed in several lanes at once, lanes still cross-connected freely, and some outputs were cut off by the length limit. What I wrote at the time: \"this proves the model isn't listening — or can't hold the line.\"",
    "r3d": "Change tack — hand it the full lane geometry, on the theory that more complete information would let it judge better.",
    "r3g": "<strong>It ran straight out of GPU memory.</strong> There is a hard exchange rate between how much you tell it and how long the context gets. That door was shut too.",
    "r4d": "Next-step proposal (not run): filter candidates in code first, keep only the eight to twelve agents nearest ego, offer each only its one or two closest candidate lanes, and describe each lane by its start, middle and end.",
    "r4g": "This was the <strong>constraint-first hypothesis</strong> formed after the three experiments. It was not implemented or quantitatively evaluated while I was there, so it is presented as a proposal, not a result.",
    "fig1_cap": "This is what went into the model: one intersection with many individually labelled lanes and traffic participants, packed so densely the labels blur together. The image is where the oversized-candidate-space diagnosis came from.",
    "sec5_co_big": "The problem was not the wording. It was the size of the candidate space I was handing over.",
    "sec5_co_p": "The number of lane and traffic-participant combinations grows rapidly, while genuinely useful relations make up only a small share. Writing \"do not enumerate\" into the prompt amounted to asking the model for restraint inside an oversized candidate space. That is not a capability problem, <strong>it is a task-design problem</strong>. The right move is to take the choice back: filter obviously irrelevant combinations during data construction so the model only sees candidates worth judging. I call this <strong>moving the constraint upstream</strong> — do not ask the model for discipline at the output; make the error unreachable at the input.",
    "sec6_label": "The lesson",
    "sec6_head": "I wrote down the right call, then failed to use it",
    "sec6_p1": "In March I wrote in my own notes that the model \"depends heavily on the training distribution — that will be a problem on driving data\". In May, what I did was <strong>take a general-purpose large model and point it straight at driving-scene relations</strong>. Same mechanism, second occurrence — and I had written it down two months in advance.",
    "sec6_p2": "Why? My answer now is that <strong>writing a judgement down and using it are two separate acts.</strong> I had treated my notes as an artefact of learning rather than an input to a decision. A judgement that lives in a document but never shows up in the next experiment design might as well not exist.",
    "sec6_p3": "There is a second mistake, and it is harder to admit: <strong>I never built an evaluation baseline.</strong> I judged the three experiments mainly by eye, so I cannot quantify how much the stricter second prompt improved on the first. A metric such as the average number of lanes assigned per agent, which should sit close to 1, would have shown much earlier that tighter wording had not solved the root cause.",
    "sec6_p4": "I had written versions of both lessons in the previous project review and still repeated them six months later. I now use two hard checks: <strong>before a new experiment, revisit what I have already written about the mechanism; in week one of a new environment, define how I will know the work got better before changing anything.</strong>"
  }
};
let lang = 'zh';
function applyLang(l) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T[l][el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;
  });
  document.getElementById('lang-btn').textContent = l === 'zh' ? 'EN' : '中文';
  document.documentElement.lang = l === 'zh' ? 'zh' : 'en';
}
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('site_lang', lang);
  applyLang(lang);
}
lang = localStorage.getItem('site_lang') || 'zh';
applyLang(lang);
</script>
