<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGWAM · Qingcheng Yu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F7F4; --text: #1A1918; --muted: #8C8880;
      --light: #B8B4AE; --border: #E0DDD6; --border-light: #EDEAE4;
      --serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
      --sans:  'Inter', -apple-system, 'PingFang SC', sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 400; line-height: 1.75; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 48px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 64px; background: rgba(248,247,244,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); }
    .nav-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-back { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .nav-back:hover { color: var(--text); }
    .nav-title { font-family: var(--serif); font-size: 1rem; }
    #lang-btn { font-size: 0.72rem; letter-spacing: 0.08em; background: none; border: 1px solid var(--border); padding: 5px 14px; cursor: pointer; color: var(--muted); transition: all 0.2s; border-radius: 2px; }
    #lang-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* HERO */
    .hero { padding: 140px 0 80px; border-bottom: 1px solid var(--border); }
    .hero-meta { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--light); margin-bottom: 28px; }
    .hero-title { font-family: var(--serif); font-size: clamp(3rem, 7vw, 6rem); font-weight: 300; line-height: 1.05; margin-bottom: 20px; }
    .hero-sub { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--muted); margin-bottom: 40px; }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--border); color: var(--muted); border-radius: 2px; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); }
    .stat { padding: 52px 40px; border-right: 1px solid var(--border-light); }
    .stat:last-child { border-right: none; }
    .stat-num { font-family: var(--serif); font-size: 3.2rem; font-weight: 300; line-height: 1; margin-bottom: 10px; }
    .stat-label { font-size: 0.75rem; color: var(--muted); line-height: 1.6; }

    /* CONTENT */
    section { padding: 80px 0; border-bottom: 1px solid var(--border); }
    .sec-label { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--light); margin-bottom: 48px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
    .two-col { display: grid; grid-template-columns: 300px 1fr; gap: 80px; align-items: start; }
    .col-head { font-family: var(--serif); font-size: 1.8rem; font-weight: 300; line-height: 1.3; }
    .col-body { font-size: 0.88rem; color: #635F5A; line-height: 1.9; }
    .col-body p + p { margin-top: 16px; }
    .col-body strong { color: var(--text); font-weight: 500; }

    /* TIMELINE */
    .timeline { display: flex; flex-direction: column; gap: 0; }
    .tl-item { display: grid; grid-template-columns: 120px 1fr; gap: 40px; padding: 28px 0; border-bottom: 1px solid var(--border-light); }
    .tl-item:last-child { border-bottom: none; }
    .tl-label { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--light); padding-top: 3px; }
    .tl-title { font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
    .tl-desc { font-size: 0.84rem; color: #706C67; line-height: 1.8; }

    /* GALLERY */
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 0; }
    .img-placeholder { width: 100%; aspect-ratio: 16/9; background: var(--border-light); border: 1.5px dashed var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .img-placeholder span { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--light); }
    .img-placeholder.tall { aspect-ratio: 4/3; }
    .gallery-full { grid-column: 1 / -1; }
    img.proj-img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* FOOTER */
    .page-footer { padding: 56px 0; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; }
    .footer-back { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .footer-back:hover { color: var(--text); }
    .footer-copy { font-size: 0.7rem; color: var(--light); }

    @media (max-width: 840px) {
      .container { padding: 0 24px; }
      .two-col, .stats { grid-template-columns: 1fr; }
      .stat { border-right: none; border-bottom: 1px solid var(--border-light); padding: 36px 0; }
      .tl-item { grid-template-columns: 1fr; gap: 6px; }
      .gallery { grid-template-columns: 1fr; }
    }
    ::selection { background: var(--text); color: var(--bg); }
  </style>
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a href="/" class="nav-back">← <span data-i18n="back">于清程</span></a>
    <button id="lang-btn" onclick="toggleLang()">EN</button>
  </div>
</nav>

<div class="hero">
  <div class="container">
    <p class="hero-meta" data-i18n="hero_meta"></p>
    <h1 class="hero-title" data-i18n="hero_title"></h1>
    <p class="hero-sub" data-i18n="hero_sub"></p>
    <div class="hero-tags"><span class="tag">Autonomous Driving</span>
      <span class="tag">World Model</span>
      <span class="tag">Scene Graph</span>
      <span class="tag">NAVSIM</span>
      <span class="tag">Graph Transformer</span></div>
  </div>
</div>

<div class="stats">  <div class="stat">
    <div class="stat-num">92.6</div>
    <div class="stat-label" data-i18n="s1"></div>
  </div>
  <div class="stat">
    <div class="stat-num">90.3</div>
    <div class="stat-label" data-i18n="s2"></div>
  </div>
  <div class="stat">
    <div class="stat-num">44.4</div>
    <div class="stat-label" data-i18n="s3"></div>
  </div></div>

<section>
  <div class="container">
    <p class="sec-label" data-i18n="sec1_label"></p>
    <div class="two-col">
      <h2 class="col-head" data-i18n="sec1_head"></h2>
      <div class="col-body">
        <p data-i18n="sec1_p1"></p>
        <p data-i18n="sec1_p2"></p>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="container">
    <p class="sec-label" data-i18n="sec2_label"></p>
    <div class="two-col">
      <h2 class="col-head" data-i18n="sec2_head"></h2>
      <div class="col-body">
        <p data-i18n="sec2_p1"></p>
        <p data-i18n="sec2_p2"></p>
        <p data-i18n="sec2_p3"></p>
      </div>
    </div>
    <div class="gallery" style="margin-top:48px">
      <div class="img-placeholder gallery-full tall"><span data-i18n="s2ph1"></span></div>
      <div class="img-placeholder"><span data-i18n="s2ph2"></span></div>
      <div class="img-placeholder"><span data-i18n="s2ph3"></span></div>
    </div>
  </div>
</section>

<div class="page-footer">
  <div class="container">
    <div class="footer-inner">
      <a href="/" class="footer-back" data-i18n="foot_back">← 返回主页</a>
      <span class="footer-copy">© 2026 Qingcheng Yu</span>
    </div>
  </div>
</div>

<script>
const T = {
  "zh": {
    "back": "于清程",
    "foot_back": "← 返回主页",
    "s1": "NAVSIM v1 PDMS",
    "s2": "NAVSIM v2 EPDMS",
    "s3": "SGS（场景图得分）",
    "sec1_label": "研究方向",
    "sec1_head": "让驾驶模型理解「场景里发生了什么关系」",
    "sec1_p1": "端到端自动驾驶模型通常直接从传感器输入映射到控制输出，中间的场景理解是隐式的。SGWAM 的思路是引入<strong>显式的场景图</strong>——不只识别「这里有一辆车」，而是建模「这辆车正在切入我的车道」这类实体间关系，再把这层结构化理解喂给世界模型。",
    "sec1_p2": "在 NAVSIM 基准上，模型取得 v1 PDMS 92.6、v2 EPDMS 90.3、SGS 44.4 的结果；工作中还构建了 navsim-SG 场景图数据集。论文已投稿 AAAI 2027，目前在审。",
    "sec2_label": "我的角色",
    "sec2_head": "如实说明：我是第五作者",
    "sec2_p1": "这是一篇七位作者的合作论文，<strong>我是第五作者，贡献有限。</strong>我把它放在这里，是因为它真实反映了我参与过的工作，而不是因为它是我的主要成果。",
    "sec2_p2": "如果面试想深挖这个方向，我能讲清楚研究动机、场景图这层抽象为什么有用、以及我具体做的那部分。<strong>但我不会把它包装成我主导的研究。</strong>",
    "sec2_p3": "【占位 · 待替换】这里将补充：我负责的具体部分、我对这个方向的理解，以及配套的方法示意图。",
    "s2ph1": "方法示意图（待补充）",
    "s2ph2": "实验结果图表（待补充）",
    "s2ph3": "场景图可视化（待补充）",
    "hero_meta": "学术研究 · AAAI 2027 投稿在审",
    "hero_title": "SGWAM",
    "hero_sub": "场景图驱动的端到端自动驾驶世界模型"
  },
  "en": {
    "back": "Qingcheng Yu",
    "foot_back": "← Back to portfolio",
    "s1": "NAVSIM v1 PDMS",
    "s2": "NAVSIM v2 EPDMS",
    "s3": "SGS (scene graph score)",
    "sec1_label": "The work",
    "sec1_head": "Teaching a driving model what is happening between the things it sees",
    "sec1_p1": "End-to-end driving models usually map sensor input straight to control output, leaving scene understanding implicit. SGWAM introduces an <strong>explicit scene graph</strong> — not just \"there is a car here\" but relations between entities, such as \"that car is merging into my lane\" — and feeds that structured understanding into the world model.",
    "sec1_p2": "On the NAVSIM benchmark the model reaches 92.6 PDMS on v1, 90.3 EPDMS on v2, and an SGS of 44.4. The work also produced the navsim-SG scene graph dataset. The paper is under review at AAAI 2027.",
    "sec2_label": "My role",
    "sec2_head": "Being straight about it: I am the fifth author",
    "sec2_p1": "This is a seven-author collaboration and <strong>I am the fifth author; my contribution was a supporting one.</strong> It is here because it honestly reflects work I took part in — not because it is my headline achievement.",
    "sec2_p2": "If an interviewer wants to go deep here, I can explain the motivation, why the scene-graph abstraction helps, and precisely which part I worked on. <strong>What I will not do is present it as research I led.</strong>",
    "sec2_p3": "[Placeholder] To be added: the specific component I worked on, my own reading of the direction, and accompanying method diagrams.",
    "s2ph1": "Method diagram (pending)",
    "s2ph2": "Results charts (pending)",
    "s2ph3": "Scene graph visualisation (pending)",
    "hero_meta": "Research · Under review at AAAI 2027",
    "hero_title": "SGWAM",
    "hero_sub": "A scene-graph-driven world model for end-to-end autonomous driving"
  }
};
let lang = 'zh';
function applyLang(l) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T[l][el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;
  });
  document.getElementById('lang-btn').textContent = l === 'zh' ? 'EN' : '中文';
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
}
function toggleLang() { lang = lang === 'zh' ? 'en' : 'zh'; applyLang(lang); }
applyLang('zh');
</script>
</body>
</html>
