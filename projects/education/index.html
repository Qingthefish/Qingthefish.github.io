<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教育背景与能力 · Qingcheng Yu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F7F4; --text: #1A1918; --muted: #8C8880;
      --light: #B8B4AE; --border: #E0DDD6; --border-light: #EDEAE4;
      --serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
      --sans:  'Inter', -apple-system, 'PingFang SC', sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 400; line-height: 1.75; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 48px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 64px; background: rgba(248,247,244,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); }
    .nav-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-back { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .nav-back:hover { color: var(--text); }
    #lang-btn { font-size: 0.72rem; letter-spacing: 0.08em; background: none; border: 1px solid var(--border); padding: 5px 14px; cursor: pointer; color: var(--muted); transition: all 0.2s; border-radius: 2px; }
    #lang-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* HERO */
    .hero { padding: 140px 0 80px; border-bottom: 1px solid var(--border); }
    .hero-meta { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--light); margin-bottom: 28px; }
    .hero-title { font-family: var(--serif); font-size: clamp(3rem, 7vw, 6rem); font-weight: 300; line-height: 1.05; margin-bottom: 20px; }
    .hero-sub { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--muted); margin-bottom: 40px; }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--border); color: var(--muted); border-radius: 2px; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); }
    .stat { padding: 52px 40px; border-right: 1px solid var(--border-light); }
    .stat:last-child { border-right: none; }
    .stat-num { font-family: var(--serif); font-size: 3.2rem; font-weight: 300; line-height: 1; margin-bottom: 10px; }
    .stat-label { font-size: 0.75rem; color: var(--muted); line-height: 1.6; }
    .stat-label strong { color: var(--text); font-weight: 500; }

    /* CONTENT */
    section { padding: 80px 0; border-bottom: 1px solid var(--border); }
    .sec-label { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--light); margin-bottom: 48px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
    .two-col { display: grid; grid-template-columns: 300px 1fr; gap: 80px; align-items: start; }
    .col-head { font-family: var(--serif); font-size: 1.8rem; font-weight: 300; line-height: 1.3; }
    .col-body { font-size: 0.88rem; color: #635F5A; line-height: 1.9; }
    .col-body p + p { margin-top: 16px; }
    .col-body strong { color: var(--text); font-weight: 500; }
    .two-col + .two-col { margin-top: 76px; }

    /* INLINE LINKS */
    .col-body a, .round-got a, .round-did a, .bound-v a, .tl-desc a, .fig figcaption a, .fig-2 figcaption a {
      border-bottom: 1px solid var(--border); transition: border-color 0.2s; }
    .col-body a:hover, .round-got a:hover, .round-did a:hover, .bound-v a:hover, .tl-desc a:hover,
    .fig figcaption a:hover, .fig-2 figcaption a:hover { border-color: var(--text); }

    /* CALLOUT */
    .callout { border-left: 2px solid var(--text); padding: 4px 0 4px 24px; margin-top: 40px; }
    .callout .big { font-family: var(--serif); font-size: 1.3rem; line-height: 1.45; color: var(--text); margin-bottom: 12px; }
    .callout p { font-size: 0.85rem; color: #4E4A45; line-height: 1.9; }
    .callout strong { color: var(--text); font-weight: 500; }
    .quote { border-left: 2px solid var(--border); padding-left: 22px; margin-top: 28px; font-family: var(--serif); font-size: 1.08rem; font-style: italic; color: #4E4A45; line-height: 1.7; }

    /* TIMELINE */
    .timeline { margin-top: 56px; border-top: 1px solid var(--border-light); }
    .tl-item { display: grid; grid-template-columns: 150px 1fr; gap: 40px; padding: 26px 0; border-bottom: 1px solid var(--border-light); }
    .tl-label { font-size: 0.7rem; letter-spacing: 0.06em; color: var(--light); padding-top: 4px; }
    .tl-title { font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
    .tl-title em { font-style: normal; color: var(--muted); font-weight: 400; }
    .tl-desc { font-size: 0.84rem; color: #706C67; line-height: 1.8; }
    .tl-desc strong { color: var(--text); font-weight: 500; }
    .tl-item.gap .tl-title { color: var(--muted); }

    /* FIGURES */
    .fig { margin-top: 44px; }
    .fig img { width: 100%; display: block; border: 1px solid var(--border-light); background: #fff; }
    .fig figcaption { margin-top: 14px; font-size: 0.76rem; color: var(--muted); line-height: 1.75; }
    .fig figcaption strong { color: var(--text); font-weight: 500; }
    .fig-2 { margin-top: 52px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 34px; align-items: start; }
    .fig-2 figure { margin: 0; }
    .fig-2 img { width: 100%; display: block; border: 1px solid var(--border-light); background: #fff; }
    .fig-2 figcaption { margin-top: 13px; font-size: 0.75rem; color: var(--muted); line-height: 1.7; }
    .fig-2 figcaption strong { color: var(--text); font-weight: 500; }

    /* ROUNDS */
    .rounds { margin-top: 44px; border-top: 1px solid var(--border-light); }
    .round { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 34px; padding: 24px 0; border-bottom: 1px solid var(--border-light); align-items: start; }
    .round-n { font-family: var(--serif); font-size: 1.7rem; font-weight: 300; color: var(--light); line-height: 0.9; }
    .round-did { font-size: 0.84rem; color: var(--text); line-height: 1.8; }
    .round-did strong { font-weight: 500; }
    .round-got { font-size: 0.84rem; color: #706C67; line-height: 1.8; }
    .round-got strong { color: var(--text); font-weight: 500; }

    /* BOUNDS */
    .bounds { margin-top: 44px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border-light); border: 1px solid var(--border-light); }
    .bound { background: var(--bg); padding: 26px 30px; }
    .bound-k { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--light); margin-bottom: 10px; }
    .bound-v { font-size: 0.83rem; color: #635F5A; line-height: 1.85; }
    .bound-v strong { color: var(--text); font-weight: 500; }

    /* FOOTER */
    .page-footer { padding: 56px 0; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; }
    .footer-back { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .footer-back:hover { color: var(--text); }
    .footer-copy { font-size: 0.7rem; color: var(--light); }

    @media (max-width: 840px) {
      .container { padding: 0 24px; }
      .two-col, .stats, .bounds, .fig-2 { grid-template-columns: 1fr; }
      .fig-2 { gap: 30px; }
      .stat { border-right: none; border-bottom: 1px solid var(--border-light); padding: 36px 0; }
      .tl-item { grid-template-columns: 1fr; gap: 6px; }
      .round { grid-template-columns: 1fr; gap: 8px; }
      .round-n { font-size: 1.2rem; }
      section { padding: 60px 0; }
    }
    ::selection { background: var(--text); color: var(--bg); }
  </style>
</head>

    "p3g": "一个判断如果落不成一张图或一条曲线，通常说明我还没想清楚。<a href=\"/projects/hqks/\">环球卡社</a>：我把乔丹纪录片前后的完整价格曲线拉出来，才看清<strong>注意力脉冲 ≠ 价值重估</strong>；也用一张 230 人的投票分布，把「通行品」这个天天在用却没人定义过的词给定下来了。<a href=\"/projects/xhs/\">小红书那页的四张图</a>是同一个习惯——没有截图可放，我就把判断本身画出来。",
    "p4d": "<strong>AI 提建议，人做决定</strong>",
    "p4g": "凡是 AI 生成或建议的东西，都要有一道人工确认，而且用户拒绝时对原文零损伤。<a href=\"/projects/hackathon/\">黑客松的确权闸门</a>是这条最完整的形态：AI 只提候选、确认前零副作用，<strong>作者的确认是把「AI 的建议」变成「事实」的唯一开关</strong>。这一条可以迁移到任何「AI 生成 + 人确认」的场景：写作的引用确认、设计的素材确认、编程的代码确认。",
    "sec6_co_big": "这四条真正的证据不是我做了什么，是我否掉了什么。",
    "sec6_co_p": "否掉「AI 装人格跟你说话」（<a href=\"/projects/hackathon/\">黑客松</a>，当时全场超三分之一的人在做）、否掉「把命令行入口下掉」（<a href=\"/projects/xhs/\">小红书</a>）、否掉用纯检测范式做安全带识别（<a href=\"/projects/ai-driving/\">AI 驾驶</a>，标了图效果很差就停手，没有硬凑一个功能上去）、否掉一整组已经想得很深但不该继续加码的中止方案（<a href=\"/projects/xhs/\">小红书</a>）。<strong>产品判断力更多体现在你拒绝了什么，而不是你堆了多少。</strong>",

    "sec7_label": "接下来这一年",
    "sec7_head": "去港科大要补什么，我很清楚",
    "sec7_p1": "2026 年 9 月我进香港科技大学读人工智能硕士，2027 年 8 月毕业。<strong>这一年不是去刷一个学历，我很清楚缺口在哪。</strong>",
    "sec7_p2": "前面这些项目，我基本是<strong>站在模型外面调用它</strong>：定义任务、设计交互、建评估、做取舍。<a href=\"/projects/casia/\">中科院那四个月</a>是第一次进去看，但只看到了一部分。",
    "sec7_p3": "缺口在<a href=\"/projects/xhs/\">小红书</a>那段暴露得最清楚：<strong>底层框架的那次选型评测不是我主导的，我跟完了全程——但我意识到，这类判断如果我自己不理解，我在产品侧就只能被动接受结论，没法参与讨论它对用户意味着什么。</strong>所以这一年我要补的不是再学一遍 Python，是把模型与框架层面的判断力，补到能参与讨论的程度。",
    "sec7_q": "产品经理不需要自己训模型。但当有人说「这个方案更好」的时候，你得问得出下一个问题。",
    "sec4_label": "我能交付什么",
    "sec4_head": "我不列「精通 / 熟悉」那种技能表——那种表最没有信息量",
    "sec4_p1": "所以下面换一种写法：<strong>我能独立交付到什么程度，以及拿哪个项目可以验证它。</strong>每一条右边都能点进去看细节；没有项目能撑的话，我就不写在这儿。",
    "c1d": "<strong>能独立把 AI 产品做到上线</strong>",
    "c1g": "React + TypeScript 前端、Python FastAPI 后端、接真实大模型、部署到公网可点开。<strong>证据：</strong><a href=\"/projects/hackathon/\">红书人物志</a>——36 小时封闭赛一个人做到 v1.0.48，现在还能点开体验；<a href=\"/projects/ai-driving/\">AI 驾驶行为检测</a>——一个人做完 11 个前端页面、9 个接口和整条检测管线。",
    "c2d": "<strong>能设计并落地 Agent</strong>",
    "c2g": "拆职责、管上下文、定输出契约、设计人工确认闸门。<strong>证据：</strong><a href=\"/projects/ai-interview/\">Job Thanos</a>——2 个真 Agent + 1 个会用工具的工序 + 1 个状态层，冷热两路的延迟预算；<a href=\"/projects/xhs/\">小红书值班 Agent</a>——0→1 的场景规划。",
    "c3d": "<strong>能从 0 建一套效果评估体系</strong>",
    "c3g": "定义指标、划清口径、主动承认偏差、把流程固化下来不让它每周漂移。<strong>证据：</strong><a href=\"/projects/xhs/\">小红书值班 Agent 的四指标体系</a>（独立解决 / 有效贡献 / 误导 / 人工介入程度）与 Job Thanos 的评分分档。",
    "c4d": "<strong>能写出工程真的能执行的 PRD</strong>",
    "c4g": "把技术约束翻译成产品定位，把异步过程、失败路径和恢复入口写完整——而不是只写「提交成功」。<strong>证据：</strong><a href=\"/projects/xhs/\">GPU 碎片治理</a>的多版 PRD 与端到端 Showcase。",
    "sec4_head2": "具体到工具",
    "sec4_p2": "Python / SQL / React；Prompt 与上下文设计；用 AI 编码工具做工程实现（<strong>我给它定的纪律写在<a href=\"/projects/xhs/\">小红书那页</a></strong>：先审影响面再动手、限定改动范围、UI 先学同项目其他模块）。数据侧：YOLOv8 / OpenCV 这类视觉管线我亲手跑通过（<a href=\"/projects/ai-driving/\">AI 驾驶</a>），BEV 与场景图这类研究侧的东西我读过、能讲清它在解决什么（<a href=\"/projects/casia/\">中科院那段</a>）。英语 IELTS <strong>7.5</strong>，可以直接用英文做产品与技术沟通。",

    "sec5_label": "几个我形成了判断的概念",
    "sec5_head": "真正让我有底气的不是学过哪些课，是有几个词我能说清它的边界",
    "sec5_p1": "AI 产品这行，很多词被用得很松。<strong>下面三个是我能说清边界的——而且每一条的判断都是从我自己做错的地方长出来的。</strong>",
    "k1d": "<strong>Agent 是什么、不是什么</strong>",
    "k1g": "我的分界线：<strong>在循环里跑、并且靠上一轮的反馈决定下一步做什么</strong>，才算 Agent。一次性的结构化抽取是「会用工具的工序」；只存状态、算跨轮差值的是「状态层」。<strong>把状态层也叫 Agent，一戳就穿。</strong>我在 <a href=\"/projects/ai-interview/\">Job Thanos</a> 里就是这么分的：4 个模块只有 2 个是真 Agent，我不虚报。能讲清 Agent 和 workflow 节点的区别，比会说 Agent 这个词有用得多。",
    "k2d": "<strong>Skill 固化的是口径，不是指令</strong>",
    "k2g": "Skill 的价值不是把一段长指令存下来，是把<strong>触发条件、数据范围、统计口径、以及失败时怎么办</strong>写死。因为 Skill 是自然语言写的，<strong>它天然会飘</strong>——口径不写进流程，就得靠人每周凭记忆保持一致，而记忆一定漂移。四条里最重要的是失败回退：<strong>抓不全就标记缺失、回到人工核验，绝不让模型自己把空补上。</strong>（<a href=\"/projects/xhs/\">值班分析那份 Skill</a> 就是按这四条写的。）",
    "k3d": "<strong>可观测性与评估：必须先于模型迭代存在</strong>",
    "k3g": "Langfuse 这类工具解决的是一个很实的问题：<strong>把 Agent 每一轮的输入输出、工具调用、延迟和成本变成可追溯的记录</strong>——否则「这次为什么答错了」根本无从回答，调参就变成玄学。<strong>这条我是用同一个错误撞了两次才真的信的：</strong><a href=\"/projects/ai-driving/\">AI 驾驶检测</a>没有标注集，任何阈值改动都答不出「变好还是变坏」；半年后在<a href=\"/projects/casia/\">中科院</a>那四轮实验里我又没建评估基线，结果说不清第四轮比第二轮好了多少。",
    "sec5_co_big": "所以我现在进任何一个新环境，第一周先问同一个问题：我怎么知道自己做的东西变好了？",
    "sec5_co_p": "这句话不是方法论口号，是我给自己定的两条硬性自查之一（另一条是：动新实验之前，先回去看自己以前写过什么——因为我在<a href=\"/projects/casia/\">中科院</a>那段里，三月写下的预判，五月被自己的实验原封不动地撞上了，而我当时根本没回头翻笔记）。<strong>写下判断和使用判断是两个动作。</strong>",
    "sec3_label": "成绩与证据",
    "sec3_head": "这一节只放能被核验的东西",
    "sec3_p1": "成绩这种事，说得再多不如把原件摆出来。下面四条都能在证书或成绩单上逐字对上。",
    "sec3_p2": "我挑那四门课放上来，不是因为分数最高，<strong>是因为它们和我现在做的事直接相关</strong>：分布式系统和系统编程解释了我为什么能读懂一个 Agent 的执行链路、能分清 WebSocket 和 SSE 各自约束什么；数据库设计解释了我为什么坚持<strong>先定数据模型再画界面</strong>——那门课教的东西，我在 <a href=\"/projects/ai-driving/\">AI 驾驶检测</a>里因为没做到而踩过一个真实的坑。",
    "e1k": "Dean's Medal",
    "e1v": "<strong>Dean's Medal for Outstanding Scholarship</strong>，2026 年授予，记录在正式成绩单的「Special achievements, recognition and prizes」栏。这是西悉尼大学授予学业最卓越毕业生的荣誉。<strong>（原件见最下方那张图）</strong>",
    "e2k": "Dean's Merit List",
    "e2v": "2024 年入选，由<strong>计算机、数据与数学科学学院院长 Kurt Langfeld 教授</strong>签发（右图）。",
    "e3k": "学位",
    "e3v": "<strong>Bachelor of Computer Science with Distinction</strong>，2026 年 1 月 21 日授予（左图）。项目 GPA <strong>6.636 / 7.0</strong>；西悉尼采用 7 分制，High Distinction 对应 85–100 分。",
    "e4k": "几门课的分数",
    "e4v": "分布式系统 <strong>97</strong>、专业实践 <strong>96</strong>、系统编程 <strong>92</strong>、数据库设计 <strong>89</strong>。",
    "fig1_cap": "学位证书：<strong>Bachelor of Computer Science with Distinction</strong>，2026 年 1 月 21 日授予。<strong>下方那串证书验证编号我抹掉了</strong>——它是可以拿去做查询的唯一标识，没有必要出现在一个公开页面上。",
    "fig2_cap": "2024 年 <strong>Dean's Merit List</strong> 证书，由计算机、数据与数学科学学院院长签发。这一年是我回学校后的第一个完整学年。",
    "sec1_label": "这条路",
    "sec1_head": "四个地方，两段本科，一个学位",
    "sec1_p1": "我的简历上有两段本科经历，<strong>但只有一个学位</strong>——中间空掉的那两年，我在西安全职做生意。这件事面试官一定会问，所以我把它放在这一页的最前面，而不是等着被追问。",
    "sec1_p2": "下面这条线里，<strong>中间那一段没有校名、也没有成绩</strong>。但如果把它抽掉，后面两段都不会发生。",
    "t1l": "2018.02 — 2019.11",
    "t1t": "澳大利亚国立大学 · 计算机科学 <em>（未完成）</em>",
    "t1d": "完整读完大一、大二。<strong>2020 年初，疫情叠加家里经济断供，学业中止。</strong>这一段我不隐去——它是后面所有事的起点。",
    "t2l": "2021.08 — 2023.07",
    "t2t": "环球卡社 · 全职创业（西安）<em>· 这一段是学费</em>",
    "t2d": "<strong>不是间隔年，是去把学费挣回来。</strong>球星卡生意，合伙人出资、我负责经营，两年全职。这两年挣的钱，就是我后来回学校读完本科的学费。<a href=\"/projects/hqks/\">→ 这段做了什么</a>",
    "t3l": "2024.07 — 2026.01",
    "t3t": "西悉尼大学 · 计算机科学学士 <em>（with Distinction）</em>",
    "t3d": "GPA <strong>6.636 / 7.0</strong>；<strong>Dean's Medal for Outstanding Scholarship（2026）</strong>、Dean's Merit List（2024）。分布式系统 97、专业实践 96、系统编程 92、数据库设计 89。学位于 2026 年 1 月 21 日授予。",
    "t4l": "2026.09 — 2027.08",
    "t4t": "香港科技大学 · 人工智能 理学硕士（MSc AI）<em>（已录取）</em>",
    "t4d": "2026 年 9 月入学，2027 年 8 月毕业——<strong>也就是 2027 届秋招的时间点。</strong>去补什么，我写在这一页最后一节。",

    "sec2_label": "断掉的那两年",
    "sec2_head": "断供是我控制不了的；停学、挣钱、再回来读完，是我自己选的",
    "sec2_p1": "2018 年我进澳大利亚国立大学读计算机科学，完整读完了大一和大二。2020 年初，疫情和家里的经济断供几乎同时到来——<strong>学费没有了。</strong>",
    "sec2_p2": "当时我没有一个能覆盖缺口的方案，也不想挂着一个读不完的学位一年一年耗下去。<strong>所以我停了。</strong>这不是一个轻松的决定，但它是当时唯一诚实的决定：先承认这个缺口是真的，再去想用多长时间填它。",
    "sec2_p3": "停下之后我没有等。2021 年 8 月，我和合伙人在西安开了环球卡社，全职做了两年——选品进货、内容与短视频、行情数据、门店与社群都是我在管。<strong>那两年挣的钱，就是我回学校念完本科的学费。</strong>这段经历后来变成我简历上最长的一段商业经验，但它当初的目的很单纯：把缺口填上。",
    "sec2_p4": "2024 年 7 月我回到学校，在西悉尼大学重读计算机科学。2026 年 1 月毕业，学位记 <strong>with Distinction</strong>，GPA 6.636/7.0，拿到 <strong>Dean's Medal</strong>。<strong>同一个人、同一个专业，中间隔了四年半。</strong>",
    "sec2_co_big": "我不想把这段包装成一个励志故事——它更像一次自己付账的项目管理。",
    "sec2_co_p": "先算清缺口有多大，再决定用多长时间填它，然后按计划执行，中途不换目标。<strong>我从这件事上学到的东西比任何一门课都硬：不抱怨条件，也不假装条件不存在。</strong>后来我做产品遇到资源不够、窗口太短、需求做不完的时候，用的还是这一套——<strong>先承认约束是真的，再在约束里找那个能做成的最小版本。</strong>",
    "back": "于清程",
    "foot_back": "← 返回主页",
    "tag5": "自费完成",
    "hero_meta": "教育背景与能力 · 2018 — 2027 · 堪培拉 / 西安 / 悉尼 / 香港",
    "hero_title": "教育",
    "hero_sub": "家里断供之后，学费是我自己挣回来的",
    "s1n": "前 1%",
    "s1": "<strong>Dean's Medal for Outstanding Scholarship</strong>（2026）——西悉尼大学授予学业最卓越毕业生的荣誉。另有 Dean's Merit List（2024）。",
    "s2n": "6.636 / 7",
    "s2": "本科 GPA。学位证书上记 <strong>with Distinction</strong>。分布式系统 97、专业实践 96、系统编程 92、数据库设计 89。",
    "s3n": "2 年",
    "s3": "我全职挣学费的时间。<strong>这两年不出现在任何一份成绩单上，但它是我能读完本科的唯一原因。</strong>"
  },
  "en": {
    // EN-ANCHOR
    "fig3_cap": "Section 4 of the <strong>Australian Higher Education Graduation Statement (AHEGS)</strong> — the official document Australian universities issue alongside the degree. Three things in one image, all checkable word for word: program GPA <strong>6.636</strong>; the 7-point scale (<strong>High Distinction = 85–100</strong>, which is why the 97 above is a High Distinction); and, at the bottom, the two lines under Special achievements — <strong>Dean's Merit List 2024</strong> and <strong>Dean's Medal for outstanding scholarship 2026</strong>. <strong>I cropped the footer out</strong>: every page of this document carries the graduate's name and student number in the footer, and a student number has no business on a public page.",
    "sec6_label": "How I tend to build",
    "sec6_head": "Six projects in, my preferences turn out to be remarkably consistent",
    "sec6_p1": "These four aren't lines I invented for this page — <strong>they are what I found when I looked back and noticed I keep making the same kind of call.</strong> So each one names a specific project; click through and check whether I actually did it that way.",
    "p1d": "<strong>Reducing mental cost beats adding features</strong>",
    "p1g": "Nobody should have to work out which product a capability belongs to, which entry point to use, or what resources it needs first. <a href=\"/projects/xhs/\">Xiaohongshu</a>: when three agents' capabilities started to overlap, <strong>what I proposed was not a fourth one but collapsing them into a single entry point</strong> — because complexity doesn't disappear, it only changes who carries it. The flip side of the same judgement: <strong>converge the entry point, not the execution body</strong>, so the sidebar, the full workbench, group chat and dev boxes each keep their own boundaries.",
    "p2d": "<strong>Don't change habits users already have</strong>",
    "p2g": "New capability should grow on the existing path instead of asking people to change behaviour first. <a href=\"/projects/hackathon/\">The hackathon</a>: publishing was <strong>never blocked</strong> — the note posts as normal, then a dismissible hint appears, and an AI failure never rolls back the author's text. That principle is also why I rejected what more than a third of the room was building — an AI that adopts a persona and talks to you: it breaks both the contract that the note belongs to its author, and the trust behind it.",
    "p3d": "<strong>Argue with data — and draw it</strong>",
    "p3g": "If a judgement can't become a chart or a curve, it usually means I haven't finished thinking. <a href=\"/projects/hqks/\">Collector Universe</a>: only after pulling the full price curve around the Jordan documentary did I see that <strong>an attention spike is not a re-rating of value</strong>; and a single distribution of 230 votes is what finally pinned down \"tradeable condition\", a term everyone used and nobody had defined. <a href=\"/projects/xhs/\">The four diagrams on the Xiaohongshu page</a> are the same habit — no screenshots I could publish, so I drew the judgements instead.",
    "p4d": "<strong>AI proposes, a human decides</strong>",
    "p4g": "Anything AI generates or suggests needs a human confirmation step, and refusing it must cost the user's original work nothing. <a href=\"/projects/hackathon/\">The confirmation gate in the hackathon project</a> is the fullest form of this: AI only proposes candidates, there are zero side effects before confirmation, and <strong>the author's confirmation is the only switch that turns a suggestion into a fact</strong>. It transfers to any \"AI generates + human confirms\" setting: citations in writing, assets in design, code in engineering.",
    "sec6_co_big": "The real evidence for these four isn't what I built. It's what I killed.",
    "sec6_co_p": "Killed the persona-driven AI chat (<a href=\"/projects/hackathon/\">hackathon</a>, while over a third of the room was building it); killed \"retire the command-line entry point\" (<a href=\"/projects/xhs/\">Xiaohongshu</a>); killed seatbelt detection as a pure-detection problem (<a href=\"/projects/ai-driving/\">AI driving</a> — I labelled images, the results were poor, and I stopped rather than forcing a feature in); killed an entire abort-and-lifecycle design I had already taken very deep but should not have kept escalating (<a href=\"/projects/xhs/\">Xiaohongshu</a>). <strong>Product judgement shows up more in what you refuse than in how much you pile on.</strong>",

    "sec7_label": "The year ahead",
    "sec7_head": "I know exactly what I'm going to HKUST to fix",
    "sec7_p1": "I start the MSc in Artificial Intelligence at HKUST in September 2026 and finish in August 2027. <strong>The year isn't about collecting a credential; I know where the gap is.</strong>",
    "sec7_p2": "Across the projects above I have mostly been <strong>outside the model, calling it</strong>: defining the task, designing the interaction, building the evaluation, making the trade-offs. <a href=\"/projects/casia/\">The four months at CASIA</a> were the first time I went inside, and I only saw part of it.",
    "sec7_p3": "The gap showed itself most clearly at <a href=\"/projects/xhs/\">Xiaohongshu</a>: <strong>the framework selection wasn't led by me. I followed it end to end — and I realised that if I don't understand judgements of that kind myself, all I can do on the product side is accept the conclusion and stay out of the discussion about what it means for users.</strong> So what I'm closing this year isn't another pass at Python. It's getting my judgement at the model and framework level up to the point where I can take part in that discussion.",
    "sec7_q": "A product manager doesn't need to train the model. But when someone says \"this approach is better\", you need to be able to ask the next question.",
    "sec4_label": "What I can deliver",
    "sec4_head": "I don't write \"proficient / familiar\" skill tables — they carry the least information of anything on a CV",
    "sec4_p1": "So here is the other way round: <strong>what I can deliver end to end, and which project you can check it against.</strong> Every line on the right is clickable. If no project backs a claim, it isn't on this list.",
    "c1d": "<strong>Ship an AI product end to end, alone</strong>",
    "c1g": "React + TypeScript front end, Python FastAPI back end, real LLM integration, deployed somewhere you can click. <strong>Evidence:</strong> <a href=\"/projects/hackathon/\">RedNote People Graph</a> — solo, 36-hour closed hackathon, iterated to v1.0.48 and still live; <a href=\"/projects/ai-driving/\">AI driving-behaviour detection</a> — 11 front-end pages, 9 endpoints and the whole detection pipeline, alone.",
    "c2d": "<strong>Design an agent and get it built</strong>",
    "c2g": "Split responsibilities, manage context, fix the output contract, design the human-confirmation gate. <strong>Evidence:</strong> <a href=\"/projects/ai-interview/\">Job Thanos</a> — 2 real agents + 1 tool-using stage + 1 state layer, with a cold/hot split driven by a latency budget; <a href=\"/projects/xhs/\">the on-call agent at Xiaohongshu</a> — the 0→1 scenario.",
    "c3d": "<strong>Build an evaluation framework from zero</strong>",
    "c3g": "Define the metrics, fix the counting rules, name the biases out loud, and freeze the process so it doesn't drift week to week. <strong>Evidence:</strong> <a href=\"/projects/xhs/\">the four-metric framework</a> for the on-call agent (resolved alone / useful contribution / misled / degree of human involvement), and the scoring bands in Job Thanos.",
    "c4d": "<strong>Write a PRD engineering can actually execute</strong>",
    "c4g": "Translate technical constraints into product positioning, and write the asynchronous path, the failure modes and the recovery entry points in full — instead of stopping at \"submitted successfully\". <strong>Evidence:</strong> the multi-version PRD and end-to-end showcase for <a href=\"/projects/xhs/\">GPU fragmentation governance</a>.",
    "sec4_head2": "The tools, specifically",
    "sec4_p2": "Python / SQL / React; prompt and context design; AI coding tools for implementation (<strong>the discipline I impose on them is written up on <a href=\"/projects/xhs/\">the Xiaohongshu page</a></strong>: review the blast radius first, bound the change, learn the project's existing UI before adding to it). On the data side: I have personally got YOLOv8 / OpenCV pipelines running (<a href=\"/projects/ai-driving/\">AI driving</a>), and I have read enough of the research side — BEV, scene graphs — to explain what it is solving (<a href=\"/projects/casia/\">the CASIA work</a>). IELTS <strong>7.5</strong>; I run product and technical discussions in English directly.",

    "sec5_label": "Concepts I have a position on",
    "sec5_head": "What gives me confidence isn't the courses. It's a handful of words whose edges I can define.",
    "sec5_p1": "In AI product work a lot of terms get used very loosely. <strong>Here are three whose boundaries I can draw — and in each case the position grew out of something I got wrong myself.</strong>",
    "k1d": "<strong>What an agent is, and isn't</strong>",
    "k1g": "My line: it runs <strong>in a loop, and it uses the previous turn's feedback to decide what to do next</strong>. A one-shot structured extraction is a \"tool-using stage\". Something that only stores state and computes deltas across turns is a \"state layer\". <strong>Call a state layer an agent and one question exposes it.</strong> That is exactly how I split <a href=\"/projects/ai-interview/\">Job Thanos</a>: of four modules, only two are real agents, and I don't inflate that. Being able to explain the difference between an agent and a workflow node is worth far more than being able to say the word.",
    "k2d": "<strong>A skill freezes definitions, not instructions</strong>",
    "k2g": "The value of a skill spec isn't storing a long prompt. It is nailing down <strong>the trigger, the data scope, the counting rules, and what happens on failure</strong>. Because a skill is written in natural language, <strong>it drifts by nature</strong> — if the definitions don't live in the process, someone has to hold them in memory every week, and memory always drifts. The most important of the four is the fallback: <strong>if the fetch is incomplete, flag the gap and return to human verification — never let the model fill the hole itself.</strong> (<a href=\"/projects/xhs/\">The on-call analysis skill</a> is written to exactly those four.)",
    "k3d": "<strong>Observability and evaluation come before model iteration</strong>",
    "k3g": "Tools like Langfuse address something concrete: <strong>turning each of an agent's turns — inputs, outputs, tool calls, latency, cost — into a traceable record</strong>. Without it, \"why was this answer wrong\" has no path to an answer and tuning becomes superstition. <strong>I only really believed this after making the same mistake twice:</strong> on <a href=\"/projects/ai-driving/\">the AI driving project</a> there was no labelled set, so no threshold change could answer \"better or worse\"; six months later, across four rounds of experiments at <a href=\"/projects/casia/\">CASIA</a>, I again built no evaluation baseline — and so could not say how much round four beat round two by.",
    "sec5_co_big": "So now, in any new environment, my first week starts with the same question: how will I know whether what I'm doing is getting better?",
    "sec5_co_p": "That isn't a slogan; it is one of two hard checks I hold myself to. The other: before starting a new experiment, go back and read what I already wrote — because at <a href=\"/projects/casia/\">CASIA</a> a prediction I wrote down in March was hit dead-on by my own experiment in May, and at the time I never went back to look at my own notes. <strong>Writing a judgement down and using it are two different actions.</strong>",
    "sec3_label": "Results and evidence",
    "sec3_head": "This section only carries things you can check",
    "sec3_p1": "With grades, describing them matters less than putting the documents up. All four lines below can be matched word for word against a certificate or the official transcript.",
    "sec3_p2": "I picked those four units not because they were my highest marks but <strong>because they map directly onto what I do now</strong>: Distributed Systems and Systems Programming are why I can read an agent's execution path and tell you what WebSocket versus SSE each constrain; Database Design is why I insist on <strong>settling the data model before drawing any screen</strong> — and on <a href=\"/projects/ai-driving/\">the AI driving project</a> I hit a real bug precisely because I failed to do that.",
    "e1k": "Dean's Medal",
    "e1v": "<strong>Dean's Medal for Outstanding Scholarship</strong>, awarded 2026, recorded under \"Special achievements, recognition and prizes\" on the official transcript. It is Western Sydney University's recognition for its most outstanding graduates. <strong>(The document itself is the bottom image.)</strong>",
    "e2k": "Dean's Merit List",
    "e2v": "Awarded 2024, signed by <strong>Professor Kurt Langfeld, Dean of the School of Computer, Data and Mathematical Sciences</strong> (right).",
    "e3k": "The degree",
    "e3v": "<strong>Bachelor of Computer Science with Distinction</strong>, conferred 21 January 2026 (left). Program GPA <strong>6.636 / 7.0</strong>; Western Sydney uses a 7-point scale, where High Distinction is 85–100.",
    "e4k": "Selected unit marks",
    "e4v": "Distributed Systems <strong>97</strong>, Professional Experience <strong>96</strong>, Systems Programming <strong>92</strong>, Database Design <strong>89</strong>.",
    "fig1_cap": "The testamur: <strong>Bachelor of Computer Science with Distinction</strong>, conferred 21 January 2026. <strong>I have removed the credential verification number</strong> that sat bottom-centre — it is a unique identifier you can run lookups against, and it has no business being on a public page.",
    "fig2_cap": "The 2024 <strong>Dean's Merit List</strong> certificate, signed by the Dean of the School of Computer, Data and Mathematical Sciences. 2024 was my first full year back at university.",
    "sec1_label": "The path",
    "sec1_head": "Four places, two runs at a bachelor's degree, one degree",
    "sec1_p1": "My CV shows two runs at an undergraduate degree <strong>and exactly one degree</strong> — the two years missing in between, I was running a business full-time in Xi'an. Any interviewer will ask about it, so it goes at the top of this page rather than waiting to be dug out.",
    "sec1_p2": "In the timeline below, <strong>the middle entry has no institution and no grades</strong>. Remove it, though, and neither of the entries after it happens.",
    "t1l": "Feb 2018 — Nov 2019",
    "t1t": "Australian National University · Computer Science <em>(not completed)</em>",
    "t1d": "Completed first and second year in full. <strong>In early 2020 the pandemic and the end of my family's funding arrived together, and I had to stop.</strong> I don't leave this out — it is where everything after it starts.",
    "t2l": "Aug 2021 — Jul 2023",
    "t2t": "Collector Universe · full-time, Xi'an <em>· this entry is the tuition</em>",
    "t2d": "<strong>Not a gap year. I went to earn the tuition.</strong> A sports trading card business — my partner funded it, I ran it, full-time for two years. What those two years earned is what paid for the degree I went back to finish. <a href=\"/projects/hqks/\">→ what the work was</a>",
    "t3l": "Jul 2024 — Jan 2026",
    "t3t": "Western Sydney University · BSc Computer Science <em>(with Distinction)</em>",
    "t3d": "GPA <strong>6.636 / 7.0</strong>; <strong>Dean's Medal for Outstanding Scholarship (2026)</strong> and Dean's Merit List (2024). Distributed Systems 97, Professional Experience 96, Systems Programming 92, Database Design 89. Degree conferred 21 January 2026.",
    "t4l": "Sep 2026 — Aug 2027",
    "t4t": "HKUST · MSc Artificial Intelligence <em>(admitted)</em>",
    "t4d": "Starting September 2026, finishing August 2027 — <strong>which is exactly the 2027 graduate hiring cycle.</strong> What I'm going there to fix is in the last section of this page.",

    "sec2_label": "The two years that broke",
    "sec2_head": "Losing the funding wasn't my choice. Stopping, earning it, and coming back to finish were.",
    "sec2_p1": "I started Computer Science at the Australian National University in 2018 and completed my first two years. In early 2020 the pandemic and the end of my family's financial support arrived almost together — <strong>the tuition was gone.</strong>",
    "sec2_p2": "I had no plan that closed the gap, and I didn't want to drag out a degree I couldn't finish, year after year. <strong>So I stopped.</strong> It wasn't a comfortable decision, but it was the only honest one available: admit the shortfall is real, then work out how long it takes to close it.",
    "sec2_p3": "I didn't wait it out. In August 2021 my partner and I opened Collector Universe in Xi'an and I ran it full-time for two years — sourcing, content and video, market data, the shop and the community. <strong>What those two years earned is what paid for finishing my degree.</strong> It later became the longest commercial entry on my CV, but at the time its purpose was simple: close the gap.",
    "sec2_p4": "In July 2024 I went back to school and did Computer Science again, at Western Sydney University. I graduated in January 2026 — degree conferred <strong>with Distinction</strong>, GPA 6.636/7.0, and the <strong>Dean's Medal</strong>. <strong>Same person, same subject, four and a half years apart.</strong>",
    "sec2_co_big": "I'd rather not dress this up as an inspirational story. It was closer to a self-funded project plan.",
    "sec2_co_p": "Size the shortfall, decide how long it takes to close, then execute without changing the target halfway. <strong>What I took from it is harder than anything a course taught me: don't complain about the constraints, and don't pretend they aren't there.</strong> When I later hit product work with too few resources, too short a window, or more requirements than time — this is still the method: <strong>accept that the constraint is real, then find the smallest version that actually ships inside it.</strong>",
    "back": "Qingcheng Yu",
    "foot_back": "← Back to portfolio",
    "tag5": "Self-funded",
    "hero_meta": "Education & capability · 2018 — 2027 · Canberra / Xi'an / Sydney / Hong Kong",
    "hero_title": "Education",
    "hero_sub": "When my family could no longer pay, I went and earned the tuition myself",
    "s1n": "Top 1%",
    "s1": "<strong>Dean's Medal for Outstanding Scholarship</strong> (2026) — Western Sydney University's recognition for its most outstanding graduates. Also Dean's Merit List (2024).",
    "s2n": "6.636 / 7",
    "s2": "Undergraduate GPA. The degree itself was conferred <strong>with Distinction</strong>. Distributed Systems 97, Professional Experience 96, Systems Programming 92, Database Design 89.",
    "s3n": "2 years",
    "s3": "Spent working full-time to earn tuition. <strong>Those two years appear on no transcript anywhere — and they are the only reason I have a degree at all.</strong>"
  }
};
let lang = 'zh';
function applyLang(l) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T[l][el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;
  });
  document.getElementById('lang-btn').textContent = l === 'zh' ? 'EN' : '中文';
  document.documentElement.lang = l === 'zh' ? 'zh' : 'en';
}
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('site-lang', lang);
  applyLang(lang);
}
lang = localStorage.getItem('site-lang') || 'zh';
applyLang(lang);
</script>
