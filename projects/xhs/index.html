<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小红书中台 · AI 基础设施 · Qingcheng Yu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F7F4; --text: #1A1918; --muted: #8C8880;
      --light: #B8B4AE; --border: #E0DDD6; --border-light: #EDEAE4;
      --serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
      --sans:  'Inter', -apple-system, 'PingFang SC', sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 400; line-height: 1.75; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 48px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 64px; background: rgba(248,247,244,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); }
    .nav-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-back { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .nav-back:hover { color: var(--text); }
    #lang-btn { font-size: 0.72rem; letter-spacing: 0.08em; background: none; border: 1px solid var(--border); padding: 5px 14px; cursor: pointer; color: var(--muted); transition: all 0.2s; border-radius: 2px; }
    #lang-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* HERO */
    .hero { padding: 140px 0 80px; border-bottom: 1px solid var(--border); }
    .hero-meta { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--light); margin-bottom: 28px; }
    .hero-title { font-family: var(--serif); font-size: clamp(3rem, 7vw, 6rem); font-weight: 300; line-height: 1.05; margin-bottom: 20px; }
    .hero-sub { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--muted); margin-bottom: 40px; }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--border); color: var(--muted); border-radius: 2px; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); }
    .stat { padding: 52px 40px; border-right: 1px solid var(--border-light); }
    .stat:last-child { border-right: none; }
    .stat-num { font-family: var(--serif); font-size: 3.2rem; font-weight: 300; line-height: 1; margin-bottom: 10px; }
    .stat-label { font-size: 0.75rem; color: var(--muted); line-height: 1.6; }
    .stat-label strong { color: var(--text); font-weight: 500; }

    /* CONTENT */
    section { padding: 80px 0; border-bottom: 1px solid var(--border); }
    .sec-label { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--light); margin-bottom: 48px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
    .two-col { display: grid; grid-template-columns: 300px 1fr; gap: 80px; align-items: start; }
    .col-head { font-family: var(--serif); font-size: 1.8rem; font-weight: 300; line-height: 1.3; }
    .col-body { font-size: 0.88rem; color: #635F5A; line-height: 1.9; }
    .col-body p + p { margin-top: 16px; }
    .col-body strong { color: var(--text); font-weight: 500; }
    .two-col + .two-col { margin-top: 76px; }

    /* CALLOUT */
    .callout { border-left: 2px solid var(--text); padding: 4px 0 4px 24px; margin-top: 40px; }
    .callout .big { font-family: var(--serif); font-size: 1.3rem; line-height: 1.45; color: var(--text); margin-bottom: 12px; }
    .callout p { font-size: 0.85rem; color: #4E4A45; line-height: 1.9; }
    .callout strong { color: var(--text); font-weight: 500; }
    .quote { border-left: 2px solid var(--border); padding-left: 22px; margin-top: 28px; font-family: var(--serif); font-size: 1.08rem; font-style: italic; color: #4E4A45; line-height: 1.7; }

    /* DIAGRAM */
    .diagram { margin-top: 52px; }
    .diagram svg { width: 100%; height: auto; display: block; }
    .diagram text { font-family: var(--sans); }
    .diagram text.dg-serif { font-family: var(--serif); }
    .dg-hint { display: none; font-size: 0.66rem; letter-spacing: 0.08em; color: var(--light); margin-bottom: 12px; }
    .dg-cap { margin-top: 16px; font-size: 0.76rem; color: var(--muted); line-height: 1.75; }
    .dg-cap strong { color: var(--text); font-weight: 500; }

    /* ROUNDS */
    .rounds { margin-top: 44px; border-top: 1px solid var(--border-light); }
    .round { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 34px; padding: 24px 0; border-bottom: 1px solid var(--border-light); align-items: start; }
    .round-n { font-family: var(--serif); font-size: 1.7rem; font-weight: 300; color: var(--light); line-height: 0.9; }
    .round-did { font-size: 0.84rem; color: var(--text); line-height: 1.8; }
    .round-did strong { font-weight: 500; }
    .round-got { font-size: 0.84rem; color: #706C67; line-height: 1.8; }
    .round-got strong { color: var(--text); font-weight: 500; }

    /* NOT-EQUAL LEDGER */
    .neq { margin-top: 44px; border-top: 1px solid var(--border-light); }
    .neq-row { display: grid; grid-template-columns: 1fr 46px 1fr; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--border-light); align-items: center; }
    .neq-a { font-size: 0.84rem; color: var(--text); line-height: 1.7; }
    .neq-op { font-family: var(--serif); font-size: 1.35rem; color: var(--light); text-align: center; line-height: 1; }
    .neq-b { font-size: 0.84rem; color: #706C67; line-height: 1.7; }

    /* BOUNDS */
    .bounds { margin-top: 44px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border-light); border: 1px solid var(--border-light); }
    .bound { background: var(--bg); padding: 26px 30px; }
    .bound-k { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--light); margin-bottom: 10px; }
    .bound-v { font-size: 0.83rem; color: #635F5A; line-height: 1.85; }
    .bound-v strong { color: var(--text); font-weight: 500; }

    /* FOOTER */
    .page-footer { padding: 56px 0; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; }
    .footer-back { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .footer-back:hover { color: var(--text); }
    .footer-copy { font-size: 0.7rem; color: var(--light); }

    @media (max-width: 840px) {
      .diagram { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .diagram svg { min-width: 1100px; }
      .dg-hint { display: block; }
      .container { padding: 0 24px; }
      .two-col, .stats, .bounds { grid-template-columns: 1fr; }
      .two-col { gap: 32px; }
      .stats { padding: 0 24px; }
      .stat { border-right: none; border-bottom: 1px solid var(--border-light); padding: 36px 0; }
      .round { grid-template-columns: 1fr; gap: 8px; }
      .round-n { font-size: 1.2rem; }
      .neq-row { grid-template-columns: 1fr; gap: 4px; padding: 16px 0; }
      .neq-op { text-align: left; font-size: 1.1rem; }
      section { padding: 60px 0; }
    }
    ::selection { background: var(--text); color: var(--bg); }
  </style>

</head>

  "en": {
    "dg_hint": "← swipe to see the full diagram →",
    "sec3_label": "Layer one · productisation",
    "sec3_head": "The 38 improvements were not a feature pile. They turned a half-built agent workspace into an everyday product.",
    "sec3_p1": "When I joined, users faced a blank input box that expected them to assemble a great deal of platform context themselves. The gap was larger than a few missing buttons: <strong>task starts, long-session navigation, tool feedback, and history consistency</strong> had not yet become a dependable experience. I split issues from walkthroughs and daily use into eight testable domains, specifying state, impact and regression paths for each.",
    "sec3_p2": "The final count is <strong>36 items with line-by-line requirement documents plus two walkthrough follow-ups: 38 independent acceptance units</strong>. I found the issues, wrote requirements and AI-coding prompts, judged impact, inspected diffs, ran regression, and handled submission and merge. AI generated code; engineers owned code review.",
    "dg2_alt": "The eight-domain distribution of 38 agent-workspace productisation improvements and the delivery boundary between product, AI and engineering",
    "dg2_scope": "38 improvements · each number is independently testable",
    "dg2_d1": "Task starts 5",
    "dg2_d2": "Input & prompts 5",
    "dg2_d3": "Copy flow 4",
    "dg2_d4": "Long-session navigation 9",

    "dg2_d7": "History & rendering 5",

    "dg2_roles": "Responsibility along one delivery chain",
    "dg2_me_k": "Me · product & acceptance",
    "dg2_me_v": "Find issue → specify / prompt → assess impact → inspect diff → regress / merge",
    "dg2_ai_k": "AI · engineering leverage",
    "dg2_ai_v": "Generate code",
    "dg2_eng_k": "Engineers · quality boundary",
    "dg2_eng_v": "Code review",
    "dg2_foot": "Naming who did what is closer to real delivery than saying only “I coded with AI.”",
    "dg2_cap": "38 = 36 documented items + two walkthrough follow-ups. Each item is independently testable and connects requirement, implementation, diff review, regression, and merge.",
    "sec7_label": "Layer three · convergence",
    "sec7_head": "The answer was not a fourth agent. It was one brand across three entry points.",
    "sec7_p1": "I compared usage contexts and behaviour data across the agent workspace, the platform assistant, and the on-call agent. Despite different surfaces, user goals kept moving between <strong>asking, doing, and fixing</strong>. Letting each product keep growing separately would simply hand the choice back to users.",
    "sec7_p2": "I proposed one brand, one entry point and continuous sessions, then designed full-screen, sidebar, text-selection and group-chat touchpoints. <strong>A unified entry point is not a forced single runtime</strong>: lightweight platform work stays with the assistant, code or container work enters the development environment, and hard cases hand off to a person. The user model converges; execution still routes by constraint.",
    "dg3_alt": "Three agent entry points converge through usage data into one assistant with three modes and multiple touchpoints while preserving separate execution environments",
    "dg3_inputs": "Three previously separate entry points",
    "dg3_i1": "Agent workspace",
    "dg3_i2": "Platform assistant",
    "dg3_i3": "On-call agent",
    "dg3_data_k": "Context & behaviour data",
    "dg3_data_v": "Overlap · broken sessions",
    "dg3_one_k": "One product model",
    "dg3_one_v": "One assistant · one session",
    "dg3_modes": "Modes: Ask · Do · Fix",
    "dg3_channels": "Surfaces: full · side · selection · chat",
    "dg3_r1": "Light platform tasks",
    "dg3_r2": "Code / container tasks",
    "dg3_foot1": "Brand, entry and session converge. Execution environments do not have to.",
    "dg3_foot2": "The assistant absorbs routing complexity; users only state the goal.",
    "dg3_cap": "Find the overlap in data, make the convergence call, then define modes, surfaces and execution routing. <strong>The product value here is not one more agent; it is one fewer choice for the user.</strong>",
    "sec11_label": "What the internship left me",
    "sec11_head": "From patching a half-built product, to validating it against real tickets, to arguing for convergence",
    "sec11_p1": "Three shifts: <strong>from adding features to a half-built product, to using real support tickets to test whether an agent has any value at all, to proposing that multiple agents and entry points converge; from asking how much capacity is idle, to understanding contiguity, pooling and who holds allocation authority; and from describing requirements as screens, to defining products as state, evidence, definitions and recovery paths.</strong>",
    "sec11_p2": "What I most want to keep isn't any internal product name. It's one judgement: <strong>the assistant should absorb platform complexity on the engineer's behalf — not repackage the product matrix, the entry-point choice and the differences in execution environment and hand them all back.</strong>",
    "sec8_label": "Supporting module · infrastructure",
    "sec8_head": "GPU fragmentation: turning a resource problem into executable rules for both sides",
    "sec8_p1": "On the surface it is one complaint: <strong>\"there are obviously free cards in the cluster, and my whole-node training job still can't get scheduled.\"</strong>",
    "sec8_p2": "The root cause isn't low utilisation. It is a <strong>shape mismatch</strong>: interactive development and training jobs share one pool, and one-, two- and four-card instances end up scattered across different nodes. The cluster may have enough free cards in total for several whole nodes, <strong>while no single node has contiguous whole-node capacity.</strong>",
    "sec8_p3": "My product work was to separate <strong>idle, under-utilised, and fragmented</strong> into three definitions; write the administrator's move-in / observe / move-back journey and the developer's choose / create / use / back-up / reclaim journey; then specify asynchronous states, failure reasons and recovery paths. This is conventional infrastructure product work, and a supporting module in the internship story.",
    "dg4_alt": "Comparison: in a shared pool small jobs carve a slice out of every node, so total idle capacity exists but no schedulable whole node does; a dedicated pool with compact placement frees complete nodes",
    "dg4_a_t": "Shared pool: training and interactive dev jobs mixed",
    "dg4_n1": "Node A",
    "dg4_n2": "Node B",
    "dg4_n3": "Node C",
    "dg4_side_a": "← taken by small dev jobs",
    "dg4_side_b": "← these two are wholly free; a big job fits",
    "dg4_a_c1": "Total free cards add up to two whole nodes —",
    "dg4_a_c2": "but not one node is completely free.",
    "dg4_b_t": "Dedicated dev pool + compact placement",
    "dg4_b_c1": "The same small jobs, placed together,",
    "dg4_b_c2": "free two whole nodes. Now the big job schedules.",
    "dg4_foot1": "Enough capacity in total does not mean a schedulable whole node exists.",
    "dg4_foot2": "So what has to change isn't average utilisation. It's pool boundaries and placement policy.",
    "dg4_cap": "The number of occupied cards is identical on both sides; <strong>the only thing that changed is where they sit.</strong> Without improving utilisation or reclaiming a single card, placement alone lets a previously unschedulable job schedule.",
    "sec6_label": "Layer two · does it work in the scenario",
    "sec6_head": "0 → 1 on an on-call agent: define the metrics first, then start analysing",
    "sec6_p1": "I picked on-call support because it satisfies four conditions at once: <strong>it is real, high-frequency, reviewable, and it already has a human workflow running.</strong> Without a human baseline there is nothing to evaluate against — you can only prove the thing can talk.",
    "sec6_p2": "And in this scenario, <strong>an agent sounding right is worth nothing</strong>. Either it resolves the ticket, or it points in the right direction and reduces human involvement, or at minimum it doesn't mislead. So I started from historical tickets — classification and opportunity analysis — and then designed its triggers, knowledge, tools and human-handover path.",
    "sec6_q": "A showcase of great cases proves the ceiling of what an agent can do. It doesn't prove the product form stands up. So what I wanted was the distribution of real tickets, not a handful of beautiful cases.",
    "sec6_p3": "The frame I used was two-dimensional: <strong>problem difficulty</strong> (standard knowledge and operations / needs context or multi-step judgement / needs an expert or crosses systems) × <strong>degree of human involvement</strong> (agent alone / light human confirmation / human supplies the key judgement / human leads throughout). Its job is to <strong>stop a single \"resolution rate\" from hiding the structure of the problem</strong>: on a hard ticket, an agent that gathers the environment and rules out the usual causes has value even without closing it; on an easy ticket, if a human still has to correct it, the product has failed.",
    "sec6_co_big": "Across consecutive iterations, useful contribution rose while misleading answers and human involvement fell.",
    "sec6_co_p": "I reviewed each iteration with the same definitions: independent resolution, useful contribution, misleading output, and human involvement, while marking tickets without a closing signal as unknown. <strong>The classification turned each miss into a clear next move: knowledge, tools, trigger, or handoff.</strong>",
    "sec2_label": "The call at the centre of it",
    "sec2_head": "The CLI and the assistant aren't side by side. One sits on top of the other.",
    "sec2_p1": "Early in the work on the new platform front end there was a tempting option on the table: <strong>retire the command-line entry point altogether</strong>. The argument sounds clean — we have a natural-language assistant now, so who is going to memorise commands?",
    "sec2_p2": "My read was the opposite. <strong>The CLI's value is invoking platform capabilities deterministically and composably. The assistant's value is understanding intent and orchestrating those capabilities. Those are two layers, not two competing products.</strong> Cut the lower one and the upper one has no reliable hands and feet — the assistant degrades into a shell that can only talk.",
    "sec2_p3": "So the conclusion: <strong>the CLI isn't going away and shouldn't be weakened — it needs to become more rigorous and more callable by programs. What changes is who uses it, not what it is worth: its primary user should shift from a person to an AI.</strong>",
    "dg1_alt": "A comparison: treating the CLI and the assistant as two parallel entry points, versus understanding them as two stacked layers",
    "dg1_a_t": "Treated as two parallel entry points",
    "dg1_a_u": "User: has to pick one first",
    "dg1_a_l": "CLI",
    "dg1_a_r": "Assistant",
    "dg1_a_c1": "The cost of choosing lands back on the user: which entry point can",
    "dg1_a_c2": "execute, which can only answer — and their capabilities overlap.",
    "dg1_b_t": "What it actually is: two layers",
    "dg1_b_1": "User · states a goal, nothing else",
    "dg1_b_2": "Assistant · reads intent, orchestrates",
    "dg1_b_3": "CLI · deterministic, composable execution",
    "dg1_b_4": "Platform · training / eval / deploy / resources",
    "dg1_n1": "Its value is understanding what you want,",
    "dg1_n2": "then deciding what to call and in what order.",
    "dg1_n3": "Its value is being deterministic and composable.",
    "dg1_n4": "Which is why it shouldn't be weakened — it has to get",
    "dg1_n5": "stricter and more callable. Its user is now a model.",
    "dg1_cap": "The reading on the left keeps adding entry points; the one on the right adds exactly one layer. Because the lower layer's user is now a model, it has to be more rigorous and composable than it ever was for humans.",
    "sec2_co_big": "I later read that agent's implementation. It is already built this way.",
    "sec2_co_p": "It has almost no tools of its own — the platform capabilities are still the same command-line tools; it is simply the model invoking them now. <strong>That validates the layered model: the assistant handles intent and orchestration; the CLI provides deterministic, composable execution.</strong>",

let lang = 'zh';
function applyLang(l) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T[l][el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;
  });
  document.getElementById('lang-btn').textContent = l === 'zh' ? 'EN' : '中文';
  document.documentElement.lang = l === 'zh' ? 'zh' : 'en';
}
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('site_lang', lang);
  applyLang(lang);
}
lang = localStorage.getItem('site_lang') || 'zh';
