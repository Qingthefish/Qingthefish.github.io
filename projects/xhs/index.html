<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小红书中台 · AI 基础设施 · Qingcheng Yu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F7F4; --text: #1A1918; --muted: #8C8880;
      --light: #B8B4AE; --border: #E0DDD6; --border-light: #EDEAE4;
      --serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
      --sans:  'Inter', -apple-system, 'PingFang SC', sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 400; line-height: 1.75; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 48px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 64px; background: rgba(248,247,244,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); }
    .nav-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-back { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .nav-back:hover { color: var(--text); }
    #lang-btn { font-size: 0.72rem; letter-spacing: 0.08em; background: none; border: 1px solid var(--border); padding: 5px 14px; cursor: pointer; color: var(--muted); transition: all 0.2s; border-radius: 2px; }
    #lang-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* HERO */
    .hero { padding: 140px 0 80px; border-bottom: 1px solid var(--border); }
    .hero-meta { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--light); margin-bottom: 28px; }
    .hero-title { font-family: var(--serif); font-size: clamp(3rem, 7vw, 6rem); font-weight: 300; line-height: 1.05; margin-bottom: 20px; }
    .hero-sub { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--muted); margin-bottom: 40px; }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--border); color: var(--muted); border-radius: 2px; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); }
    .stat { padding: 52px 40px; border-right: 1px solid var(--border-light); }
    .stat:last-child { border-right: none; }
    .stat-num { font-family: var(--serif); font-size: 3.2rem; font-weight: 300; line-height: 1; margin-bottom: 10px; }
    .stat-label { font-size: 0.75rem; color: var(--muted); line-height: 1.6; }
    .stat-label strong { color: var(--text); font-weight: 500; }

    /* CONTENT */
    section { padding: 80px 0; border-bottom: 1px solid var(--border); }
    .sec-label { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--light); margin-bottom: 48px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
    .two-col { display: grid; grid-template-columns: 300px 1fr; gap: 80px; align-items: start; }
    .col-head { font-family: var(--serif); font-size: 1.8rem; font-weight: 300; line-height: 1.3; }
    .col-body { font-size: 0.88rem; color: #635F5A; line-height: 1.9; }
    .col-body p + p { margin-top: 16px; }
    .col-body strong { color: var(--text); font-weight: 500; }
    .two-col + .two-col { margin-top: 76px; }

    /* CALLOUT */
    .callout { border-left: 2px solid var(--text); padding: 4px 0 4px 24px; margin-top: 40px; }
    .callout .big { font-family: var(--serif); font-size: 1.3rem; line-height: 1.45; color: var(--text); margin-bottom: 12px; }
    .callout p { font-size: 0.85rem; color: #4E4A45; line-height: 1.9; }
    .callout strong { color: var(--text); font-weight: 500; }
    .quote { border-left: 2px solid var(--border); padding-left: 22px; margin-top: 28px; font-family: var(--serif); font-size: 1.08rem; font-style: italic; color: #4E4A45; line-height: 1.7; }

    /* DIAGRAM */
    .diagram { margin-top: 52px; }
    .diagram svg { width: 100%; height: auto; display: block; }
    .diagram text { font-family: var(--sans); }
    .diagram text.dg-serif { font-family: var(--serif); }
    .dg-cap { margin-top: 16px; font-size: 0.76rem; color: var(--muted); line-height: 1.75; }
    .dg-cap strong { color: var(--text); font-weight: 500; }

    /* ROUNDS */
    .rounds { margin-top: 44px; border-top: 1px solid var(--border-light); }
    .round { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 34px; padding: 24px 0; border-bottom: 1px solid var(--border-light); align-items: start; }
    .round-n { font-family: var(--serif); font-size: 1.7rem; font-weight: 300; color: var(--light); line-height: 0.9; }
    .round-did { font-size: 0.84rem; color: var(--text); line-height: 1.8; }
    .round-did strong { font-weight: 500; }
    .round-got { font-size: 0.84rem; color: #706C67; line-height: 1.8; }
    .round-got strong { color: var(--text); font-weight: 500; }

    /* NOT-EQUAL LEDGER */
    .neq { margin-top: 44px; border-top: 1px solid var(--border-light); }
    .neq-row { display: grid; grid-template-columns: 1fr 46px 1fr; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--border-light); align-items: center; }
    .neq-a { font-size: 0.84rem; color: var(--text); line-height: 1.7; }
    .neq-op { font-family: var(--serif); font-size: 1.35rem; color: var(--light); text-align: center; line-height: 1; }
    .neq-b { font-size: 0.84rem; color: #706C67; line-height: 1.7; }

    /* BOUNDS */
    .bounds { margin-top: 44px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border-light); border: 1px solid var(--border-light); }
    .bound { background: var(--bg); padding: 26px 30px; }
    .bound-k { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--light); margin-bottom: 10px; }
    .bound-v { font-size: 0.83rem; color: #635F5A; line-height: 1.85; }
    .bound-v strong { color: var(--text); font-weight: 500; }

    /* FOOTER */
    .page-footer { padding: 56px 0; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; }
    .footer-back { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .footer-back:hover { color: var(--text); }
    .footer-copy { font-size: 0.7rem; color: var(--light); }

    @media (max-width: 840px) {
      .container { padding: 0 24px; }
      .two-col, .stats, .bounds { grid-template-columns: 1fr; }
      .stat { border-right: none; border-bottom: 1px solid var(--border-light); padding: 36px 0; }
      .round { grid-template-columns: 1fr; gap: 8px; }
      .round-n { font-size: 1.2rem; }
      .neq-row { grid-template-columns: 1fr; gap: 4px; padding: 16px 0; }
      .neq-op { text-align: left; font-size: 1.1rem; }
      section { padding: 60px 0; }
    }
    ::selection { background: var(--text); color: var(--bg); }
  </style>
</head>

    "b4v": "底层框架做过一次切换，那次选型评测<strong>不是我主导的，我跟完了全程</strong>。它让我意识到一件事：这类判断如果我不理解，我在产品侧就只能被动接受结论，没法参与讨论它对用户意味着什么。<strong>这是我下一阶段最想补的地方。</strong>",
    "b5k": "落地程度",
    "b5v": "「已开发」指我完成了对应的代码改动，<strong>不自动等于长期全量稳定运行</strong>。资源治理完成了多版 PRD 与端到端 Showcase、并形成了推广节点，<strong>但没有结果证据证明碎片率已达到目标，我也不宣称释放了多少张卡。</strong>",
    "b6k": "未落地",
    "b6v": "中止、任务状态与生命周期那一整组是<strong>未落地探索</strong>。我把它写在这一页上，是因为<strong>它的教训比它的结果值钱。</strong>",
    "sec11_label": "这段实习留下什么",
    "sec11_head": "从给半成品补功能，到用真实工单验证价值，再到主动提出收敛",
    "sec11_p1": "三个层次的变化：<strong>从给一个半成品补功能，到用真实工单验证 Agent 到底有没有价值，再到主动提出多 Agent 与多入口收敛；从看「有多少空闲资源」，到理解资源的连续性、池化与组织分配权；从用页面描述需求，到用状态、证据、口径与恢复路径定义产品。</strong>",
    "sec11_p2": "我最想留下的不是任何一个内部产品名，是一条判断：<strong>助手应该替工程师吸收平台复杂度，而不是把复杂的产品矩阵、入口选择和底层执行差异重新包装一遍，再交还给用户。</strong>",
    "sec11_p3": "但它有同等重要的另一半，也是我这段最大的收获：<strong>吸收复杂度不等于掩盖真实状态。</strong>越是能执行、会产生副作用的系统，越要把边界、风险和结果证据设计清楚。<strong>一个什么都替你做了、却不告诉你它做到哪一步的助手，比一个要你自己敲命令的 CLI 更危险。</strong>",
    "sec8_label": "另一条主线",
    "sec8_head": "GPU 碎片治理：空闲、低利用率、碎片，是三个不同的词",
    "sec8_p1": "表面问题是一句抱怨：<strong>「集群明明有空闲卡，我的整机训练任务还是排不上。」</strong>",
    "sec8_p2": "根因不是利用率低，是<strong>资源形态不匹配</strong>：交互式开发任务和训练任务共用一个资源池，单卡、双卡、四卡这些小规格实例分散占住不同节点。集群总共空着的卡可能够好几台整机，<strong>但没有任何一个单节点拥有连续的整机容量。</strong>",
    "sec8_p3": "所以我做这条线的第一件事，是把三个天天被混用的词分开：<strong>空闲 ≠ 低利用率 ≠ 碎片。</strong>「运行时长」只是一个治理用的代理指标，<strong>它不等于低利用率</strong>——一个跑了很久的开发环境完全可能一直在高负载。所以运行时长只能用来筛选机会，不能直接拿去回收。这一条我在方案里写得很重，因为它一旦被当成结论，受伤的是真在用资源的人。",
    "sec8_p4": "我先做了现状分析和竞品调研——阿里云 PAI-DSW、腾讯云 TI-ONE、火山引擎 MLP 这些公有云 ML 平台是怎么切这块的——方案前后迭代了多版。核心是把组织层的分配权还给管理员，同时不牺牲开发者的灵活度：",
    "dg4_alt": "对照图：共池时小规格任务把每个节点都切掉一部分，总空闲够整机却没有可调度的整机；独立池加紧凑放置后腾出完整节点",
    "dg4_a_t": "共池：训练任务与交互式开发任务混排",
    "dg4_n1": "节点 A",
    "dg4_n2": "节点 B",
    "dg4_n3": "节点 C",
    "dg4_side_a": "← 被小规格开发任务占住",
    "dg4_side_b": "← 这两台完整空闲，能接整机任务",
    "dg4_a_c1": "总空闲卡加起来够两台整机——",
    "dg4_a_c2": "但没有任何一个节点是完整空闲的。",
    "dg4_b_t": "独立开发机池 + 紧凑放置",
    "dg4_b_c1": "同样这些小规格任务，集中放置之后",
    "dg4_b_c2": "腾出两台完整节点，整机任务排得上了。",
    "dg4_foot1": "总量充足，不代表存在可调度的整机。",
    "dg4_foot2": "所以该动的不是平均利用率，是资源池的边界与池内的放置策略。",
    "dg4_cap": "示意图，格子数是为了讲清结构而设的，<strong>不代表真实的集群规模</strong>。左右两边被占用的卡数完全一样——<strong>变的只有放在哪里。</strong>这也是这条线最反直觉的地方：不提升任何利用率、不回收任何一张卡，只改放置策略，就能让原本排不上的整机任务排上。",
    "g1d": "<strong>建独立开发机资源池</strong>",
    "g1g": "与训练、推理资源池隔离，管理员<strong>以整机为单位</strong>把资源划进来。CPU 开发环境不占 GPU 池。",
    "g2d": "<strong>池内继续允许小规格</strong>",
    "g2g": "进了开发机池，用户照样能申请单卡、双卡、四卡或整机。<strong>没有粗暴禁止开发者用小规格</strong>——那只是把成本转移给开发效率，问题会从另一头长出来。",
    "g3d": "<strong>池内紧凑放置</strong>",
    "g3g": "小规格任务优先放进「能容纳、且放置后剩余最少」的节点，<strong>目的是尽量多地保住完整节点</strong>，去接更大规格的任务。",
    "g4d": "<strong>三类池受控互转 + 旧入口迁移</strong>",
    "g4g": "按业务峰谷调配，但<strong>只有空闲整机才能划回</strong>。旧入口停止新增并逐步迁移；用看板观察规格分布、长期运行与池内余量。",
    "sec8_co_big": "页面上的「提交成功」，不等于资源已经可用。",
    "sec8_co_p": "底层可以抽象成三步：管理面记录目标资源池，控制组件让节点的实际状态逐步收敛，调度器读最终状态做隔离。<strong>而我的产品责任是把这个异步过程写完整</strong>：来源和目标是否匹配、机器是否整机空闲、转换是不是还在处理中、最终有没有到账、部分占用为什么不能划回、失败之后怎么恢复。<strong>机器台数、卡数、配额，这三个也不能混为一谈。</strong>还有一点：这套治理同时影响两类人——只站管理员视角，治理会变成强限制；只站开发者视角，训练池会继续被切碎。<strong>所以我分别画了管理员的「划入—观察—划回」和开发者的「选择—创建—使用—备份—回收」两条旅程，再用隔离与调度把两端接起来。</strong>",
    "sec7_label": "第三层 · 产品统一性",
    "sec7_head": "统一入口，不等于统一 Runtime",
    "sec7_p1": "到这时，三个 Agent 场景已经并存：基础设施 Agent、值班 Agent、平台助手。它们的触发位置不同，但知识、查询、诊断这些能力开始明显重叠。<strong>如果继续分别建设，每个助手都要维护自己的一套提示词、技能、工具接入和评估——长期一定漂移；而用户还得记住哪个助手负责什么。</strong>",
    "sec7_p2": "所以我主动提了多 Agent 合并。<strong>动机不是想做一个更大的机器人</strong>，是降低工程师三件事的成本：学习产品矩阵、选择入口、切换上下文。",
    "sec7_p3": "但这里有一个很容易被做错的地方：<strong>统一入口不等于把所有能力塞进同一个执行体。</strong>各触点的交互能力和风险边界本来就不同。最典型的是侧边栏——它走的是单轮 SSE，而 <strong>HITL（人在环中）需要一条把用户的决定送回执行现场的上行通道</strong>。SSE 是单向的：请求发出去之后，用户只能看；审批、中止、补充输入都发不进去，而且每一轮是独立请求，多轮状态没有天然的挂靠点。",
    "sec7_p4": "<strong>但这不是缺陷，是定位。</strong>侧边栏就该接那些不需要中途介入的任务；需要审批和中止的，应该被引导到全屏形态去做。<strong>把两个触点说成能力相同，才是真正的产品错误。</strong>",
    "dg3_alt": "结构图：一个统一入口之下，四个触点各自保留不同的传输方式、执行环境与风险边界",
    "dg3_top": "统一助手 · 统一的是能力发现、身份与上下文",
    "dg3_c1s": "WebSocket · 双向、多事件",
    "dg3_c1t": "完整工作台",
    "dg3_c1a": "复杂多轮任务",
    "dg3_c1b": "工具状态、中止",
    "dg3_c1c": "HITL：审批 / 补参 / 恢复",
    "dg3_c2s": "SSE · 单向，只能往下推",
    "dg3_c2t": "平台侧边栏",
    "dg3_c2a": "当前页面上下文、轻量单轮",
    "dg3_c2b": "没有上行通道：审批、中止",
    "dg3_c2c": "补充输入都发不进去",
    "dg3_c2d": "下行有，上行没有",
    "dg3_c3s": "异步 · 在问题发生的现场",
    "dg3_c3t": "群聊",
    "dg3_c3a": "值班触发与人工协作",
    "dg3_c3b": "展示与交互能力弱",
    "dg3_c3c": "适合人工接管",
    "dg3_c4s": "长期进程 · 隔离环境",
    "dg3_c4t": "云端开发机",
    "dg3_c4a": "代码、文件、终端",
    "dg3_c4b": "需要容器的任务",
    "dg3_c4c": "可从轻入口平滑转入",
    "dg3_up": "需要审批或中止时 → 引导升级到全屏形态（而不是假装两个触点能力相同）",
    "dg3_foot": "对用户，统一的是入口；对系统，仍然保留不同的 Runtime 与权限边界。",
    "dg3_cap": "这张图想说的是<strong>「该收敛的是入口，不是执行体」</strong>。用户侧要统一的只有四样：能力发现、入口认知、身份、上下文；而传输方式、执行环境、权限边界该不一样就不一样。<strong>把技术约束（SSE 没有上行通道）翻译成产品定位（侧边栏只接不需要中途介入的任务），是我认为产品经理在这类系统里最该干的活。</strong>",
    "ss1k": "同群追加",
    "ss1v": "同一用户在同一个群里的后续提问，追加到同一个 Session。",
    "ss2k": "跨群与跨人隔离",
    "ss2v": "同一用户在不同群分别建 Session，<strong>避免跨群污染</strong>；不同用户之间彼此隔离。",
    "ss3k": "只同步真正发生的",
    "ss3v": "只显示用户明确 @ 了 Agent 的内容、以及<strong>成功发送出去的回答</strong>；过滤群聊噪声、工具内部过程和失败草稿。<strong>发送失败的回答，不能在统一会话里显示成已送达。</strong>",
    "ss4k": "平台侧默认只读",
    "ss4v": "避免把群聊里的上下文直接变成高风险执行权限。<strong>Session 不只是消息数组</strong>——它还该关联任务状态、关键工具结果、产物、审批与中断点，但各触点可以用不同方式展示。",
    "sec6_label": "第二层 · 场景有效性",
    "sec6_head": "0 → 1 做值班 Agent：先把指标定义清楚，再开始分析",
    "sec6_p1": "我选值班场景，是因为它同时满足四个条件：<strong>真实、高频、可复盘、而且已经有一套人在跑的工作流。</strong>有人工基线，才谈得上评估——否则你只能证明它「能说话」。",
    "sec6_p2": "而在这个场景里，<strong>Agent 答得「像」是没有意义的</strong>。它要么独立解决，要么给出正确方向、减少人工介入，要么至少别误导。所以我先看历史工单、做分类与机会空间分析，再规划它的触发、知识、工具和人工接管方式。（底层接入与服务实现由工程侧负责。）",
    "sec6_q": "「优秀案例」证明的是 Agent 的能力上限，不一定能证明这个产品形态成立。所以我要的是真实工单的分布，不是几个漂亮 case。",
    "sec6_p3": "我用的是一个二维框架：<strong>问题难度</strong>（标准知识与操作 / 需要上下文或多步判断 / 需要专家或跨系统协作）× <strong>人工介入程度</strong>（Agent 独立 / 人工轻量确认 / 人工提供关键判断 / 人工全程主导）。它的作用是<strong>不让一个「解决率」把问题结构盖住</strong>：复杂问题即使不能自动闭环，Agent 先收集环境、排除常见原因也有价值；简单问题如果还要人工纠偏，那就是产品没达标。",
    "sec6_p4": "所以我没有只看「回答率」。我把它拆成四个指标——<strong>这一步是整件事里最关键的一步，因为指标一旦定错，后面所有分析都会往错的方向努力：</strong>",
    "k1d": "<strong>独立解决</strong>",
    "k1g": "Agent 自己把工单收尾，没有人工接手。",
    "k2d": "<strong>有效贡献</strong>",
    "k2g": "要么独立解决，要么给出了正确方向。<strong>这比「回答率」严得多——回答了但方向是错的，不算贡献。</strong>",
    "k3d": "<strong>误导</strong>",
    "k3g": "给了错误方向、需要人工纠偏。<strong>它必须和有效贡献一起看</strong>：否则「更积极地回答」可能只是在制造更多的人工清理成本。",
    "k4d": "<strong>人工介入程度</strong>",
    "k4g": "按上面那四档打分再取均值（1 = Agent 独立，4 = 人工全程主导）。<strong>它衡量的不是答得好不好，是人少干了多少活</strong>——这才是这个产品真正被买单的地方。",
    "sec6_co_big": "连续三周：有效贡献率 69.3% → 74.7% → 88.3%，误导率 27.1% → 20.9% → 10.3%。",
    "sec6_co_p": "同期人工介入程度的均值从 <strong>2.46 降到 1.84</strong>，降幅约 25%。<strong>但这组数必须打折，而且我自己先打</strong>：部分工单没有明确的关闭信号，「用户沉默」可能被算成已解决；分类里有人工标注，存在主观判断；不同时段的工单结构本身在变；系统不可用造成的失败和知识错误，也可能落进同一个负向分类。<strong>所以它是产品迭代信号，不是无偏的因果结论。</strong>还有一个边界：我完整跟过其中一整周的值班过程，其他时段是持续观察与数据分析，<strong>不是每一单都由我逐条人工确认。</strong>",
    "sec6_head2": "把口径固化下来，而不是把指令复制一遍",
    "sec6_p6": "每周都要出一次分析，而这件事最怕的不是慢，是<strong>这周和上周的口径不一样</strong>——口径一飘，趋势就没有意义了。所以我把这套可重复的流程固化成一份技能说明（Skill），让它每次都按同一个范围、同一套定义执行：",
    "sk1k": "触发条件",
    "sk1v": "只在需要按明确时间范围复盘值班工单、或生成周报时触发。<strong>不是所有对话都该唤起它。</strong>",
    "sk2k": "数据范围",
    "sk2v": "只处理指定群、指定时间窗内、与工单相关的消息，<strong>不向无关会话扩张</strong>——范围失控的分析等于没有分析。",
    "sk3k": "统计口径",
    "sk3v": "同一工单如何去重、什么叫独立解决 / 有效贡献 / 误导、缺失关闭信号如何标记。<strong>定义写进流程，而不是每周靠记忆。</strong>",
    "sk4k": "失败回退",
    "sk4v": "抓取不全、字段缺失、消息无法关联时，<strong>保留缺失标记并回到人工核验——不让模型自己把空补上。</strong>这是整份 Skill 里我认为最重要的一条。",
    "sec5_label": "一组没落地的探索",
    "sec5_head": "那个「中止」按钮，教我状态机必须先于 UI",
    "sec5_p1": "我从一个中止报错开始追，一路追到了会话状态、工具事件、远端副作用和恢复语义。核心问题非常真实：<strong>停止模型的流式输出，不等于撤销了已经发生的文件修改，也不等于远端任务停了。</strong>如果任务已经产生副作用，UI 只显示一个「已停止」，是在给用户错误的安全感。",
    "sec5_p2": "我为它做了一整组分析和方案：长任务黑盒、中止的二次确认、工具执行状态、停止后的状态说明。<strong>但这整组最终没有落地。</strong>所以它不能被写成「推动落地」或「完成改造」，也不进前面那 16 项。",
    "sec5_p3": "它留下的两条东西，我认为比一个上线的按钮值钱：<strong>第一，状态机必须先于 UI。</strong>中止按钮之所以越做越复杂，就是因为我从界面开始想，后来才发现模型、工具、文件、远端任务各有各的生命周期。<strong>第二，探索到一定阶段要判断投入产出，而不是因为方案是自己提的就一直加码。</strong>后面那条更难做到。",
    "sec5_q": "先画期望状态、实际状态、异步事件、副作用、失败补偿和恢复入口，再设计页面。这个顺序，是这次错出来的。",
    "sec4_label": "第一层 · 单点可用性",
    "sec4_head": "从「用户不会问」切入，不是从「界面不好看」切入",
    "sec4_p1": "基础设施任务的输入很重：跑一个训练任务，要给模型、数据、资源规格、并发、输出位置。<strong>让新用户对着一个空白输入框，等于把平台知识和 prompt 组织成本一起推给他</strong>——他不是不想用，他是<strong>不知道该问什么</strong>。",
    "sec4_p2": "所以我把高频任务做成场景化的快捷模板：点一下，得到一道<strong>可编辑的填空题</strong>，覆盖接口接入、数据处理、训练、部署、批量推理几条链路。模板只要求完成任务真正必需的信息，对附件、路径这类容易填错的输入直接给出明确提示。",
    "sec4_p3": "围绕它我做了一组交互：占位符点击全选、长文本大输入框、未填占位符提醒、以及短时间内允许强制发送。<strong>设计目标不是把聊天框变成表单</strong>——自由表达必须留着，只是别让人栽在低级错误上。<strong>系统先提醒，最终决定权仍然在用户手里。</strong>",
    "sec4_p4": "这一层加起来，是<strong>至少 16 项由我提出、并由我亲手改代码完成的前端需求与修复</strong>。但我更想讲的不是这个数，是它<strong>怎么数出来的</strong>——因为一个产品经理报数字的方式，比数字本身更能说明他可不可信：",
    "f1d": "<strong>同一能力被拆成多个实现，只计 1 项</strong>",
    "f1g": "「复制」这件事在代码里是一个底层工具加好几个按钮。按代码文件数它能算好几项；按「用户遇到的问题」，它只有一个——<strong>他复制不了。</strong>",
    "f2d": "<strong>后续修复并入原需求，不重复计数</strong>",
    "f2g": "轮次导航上线后又改了首尾高亮、展示门槛、防遮挡。那是同一个需求的增强，不是三个新需求。<strong>把一次迭代拆成三条，是最常见的注水方式。</strong>",
    "f3d": "<strong>同批开发但解决不同问题，分别计数</strong>",
    "f3g": "占位符点击全选和长文本大输入框是一次开发做完的，但一个解决「改模板太麻烦」，一个解决「长内容看不见」。<strong>是两个用户问题，就算两项。</strong>",
    "f4d": "<strong>没落地的不计，不是我写的代码不计</strong>",
    "f4g": "中止与任务状态那一整组最终没上，不进这 16 项；测试、用户分析、竞品调研与评测文档也不冒充开发需求。<strong>所以 16 是下界，不是上限。</strong>",
    "sec4_co_big": "这些前端是我用 AI 编码工具写的，纪律是我定的。",
    "sec4_co_p": "我把约束写进项目的 AI 协作规范：<strong>先审查相关代码与影响面再动手；限定改动范围，优先最小可验证改动；做 UI 前先学同项目其他模块的样式，不另造一套语言；文件保持小而清晰。</strong>闭环是——需求拆解与验收条件 → 让编码助手先读相关代码 → 小步改 → 检查 Diff 和边界状态 → 隔离环境验证 → 提交代码评审 → 按 Review 改 → 流水线验证 → 发布走查。<strong>AI 提高的是实现速度，同时放大三种风险：范围失控、重复逻辑、以及「看起来完成了」。所以用它的时候，纪律要比手写时更严。</strong>",
    "sec3_label": "为什么是「速度」，而不是「简单」",
    "sec3_head": "复杂度不会消失，它只会换人承担",
    "sec3_p1": "「把产品做简单」这句话我很少用，因为它不指向任何可操作的东西。<strong>真正决定用户体感的是两个速度之差</strong>：平台在不停加能力，新概念是持续产生的；如果我们吸收复杂度的动作慢于它产生的速度，<strong>差额会自动堆到用户身上。</strong>",
    "sec3_p2": "这里面没有坏人。<strong>不需要谁做错什么——只要平台跑得比封装快，用户的学习负担就单调上升。</strong>它也解释了一个很常见的现象：平台功能越来越强，用户满意度却越来越低。不是功能不好，是吸收速度输给了产生速度。",
    "sec3_p3": "所以我在这儿的目标不是「把界面做简单」，是<strong>把吸收动作做快</strong>：平台新加一个能力，用户不该等我们改一版界面、补一篇文档、开一场培训之后才敢用它。",
    "sec3_q": "「AI 时代，只要你学得够慢，你就不用学了。」——这句是玩笑，但它指着一件真事：新概念的产生速度已经快过任何人的学习速度。所以正确的解法不是要求用户跟上，是把它吸收掉。",
    "dg2_alt": "示意图：平台产生复杂度的速度快于产品吸收复杂度的速度，两条曲线之间的差额就是用户必须自己承担的学习负担",
    "dg2_y": "累积复杂度",
    "dg2_x": "时间",
    "dg2_l1": "平台产生复杂度的速度",
    "dg2_g1": "差额 =",
    "dg2_g2": "用户必须自己学的那部分",
    "dg2_l2": "产品吸收复杂度的速度",
    "dg2_foot": "不需要谁做错什么。只要平台跑得比封装快，学习负担就单调上升。",
    "dg2_cap": "这是示意，不是实测曲线——<strong>它要说明的是形状，不是数值</strong>。两条线都在涨（平台在变强，产品也在跟进），但只要斜率不同，中间那块阴影就会一直变大。<strong>阴影不会凭空消失，它只会变成某个人的学习成本。</strong>做中台产品，我认为要盯的就是这块阴影的增速。",
    "sec3_co_big": "产品是被动的艺术。",
    "sec3_co_p": "所有让用户「思考一下、琢磨一下」的设计，本质上都是在给自己抬高门槛、降低转化率。<strong>用户不该为了用一个平台能力，先搞清这个能力属于哪个产品、该从哪个入口进、要什么前置资源。</strong>这话听着像消费产品的道理，但它在中台更狠：工程师的时间成本是能被直接算出来的——他嫌麻烦就真的不用了，转头回去敲他熟的那几条命令。<strong>没有反馈、没有投诉，只有一条静默流失。</strong>",
    "sec2_label": "最核心的一条判断",
    "sec2_head": "CLI 和助手不是并列关系，是上下分层",
    "sec2_p1": "做新一代平台前端的初期，桌上有一个很有诱惑力的方案：<strong>把命令行入口直接下掉</strong>。理由听着很顺——都有自然语言助手了，谁还去记命令？",
    "sec2_p2": "我的判断是反过来的。<strong>命令行的价值是「确定、可组合地调用平台能力」；助手的价值是「理解意图，并编排这些能力」。这是上下两层，不是两个竞品。</strong>把下面那层砍掉，上面那层就没有可靠的手脚——助手会退化成一个只会说话的壳。",
    "sec2_p3": "所以结论是：<strong>CLI 不会消失，也不该被弱化——它反而要变得更规范、更可被程序调用。变的是它的使用者，不是它的价值：主要使用者应该从人变成 AI。</strong>",
    "dg1_alt": "对照图：把 CLI 和助手当成并列的两个入口，与把它们理解成上下分层的两层",
    "dg1_a_t": "当成并列的两个入口",
    "dg1_a_u": "用户：先得选一个",
    "dg1_a_l": "CLI",
    "dg1_a_r": "助手",
    "dg1_a_c1": "选择成本落回用户身上：他要先判断哪个入口能执行、",
    "dg1_a_c2": "哪个只能回答——而两边的能力还在互相重叠。",
    "dg1_b_t": "实际是上下分层",
    "dg1_b_1": "用户 · 只表达目标",
    "dg1_b_2": "助手 · 理解意图、编排能力",
    "dg1_b_3": "CLI · 确定、可组合地执行",
    "dg1_b_4": "平台能力 · 训练 / 评测 / 部署 / 资源",
    "dg1_n1": "它的价值是「听懂你要什么」，",
    "dg1_n2": "并决定调什么、按什么顺序调。",
    "dg1_n3": "它的价值是「确定、可组合」。",
    "dg1_n4": "所以它不该被弱化，反而要更规范、",
    "dg1_n5": "更可被程序调用——使用者换成了模型。",
    "dg1_cap": "<strong>本页四张图都是我自己画的</strong>——这段经历没有可公开的截图，所以我把判断本身画出来。左边那种理解会让入口越加越多；右边这种理解只多一层，而下面那层因为使用者变成了模型，反而必须写得比给人用时更规范。",
    "sec2_co_big": "后来我读了那个 Agent 的实现，它已经是这么造的。",
    "sec2_co_p": "它几乎没有属于自己的专用工具——平台能力还是原来那些命令行工具，只是现在敲命令的是模型。<strong>让我确信这个方向对的，不是我想得多顺，是我看到它已经这么运行、并且我理解为什么要这么设计。</strong>（这份实现的架构现状梳理由工程侧完成。）",
    "sec1_label": "入场盘面",
    "sec1_head": "不是从零造平台，是用户得先自己拼出一张产品地图",
    "sec1_p1": "我进入项目时，平台该有的能力其实都有：命令行工具承担训练、评测、部署与资源操作；云端开发机提供代码、文件、终端和长期运行环境；还有一个已经能用自然语言调用部分平台能力的 Agent 半成品，以及散落在各个页面和群里的查询、诊断与知识能力。",
    "sec1_p2": "所以问题从来不是「平台什么都没有」。<strong>问题是一个工程师必须先回答一组产品问题，才能开始解决他自己的那个问题</strong>：我该用命令行、网页、开发机还是 Agent？这个入口是能执行，还是只能回答？我切到另一个入口，前面的上下文还在不在？同一个能力，为什么在三个助手里都出现？",
    "sec1_p3": "这些问题的答案，全都藏在平台的组织结构里——<strong>而用户凭什么要懂我们的组织结构。</strong>所以我做的第一件事不是接需求，是把问题重新定义成三层：",
    "r1d": "<strong>单点可用性</strong>",
    "r1g": "那个 Agent 半成品，是真的能用，还是只能演示？<strong>这两件事之间的距离，比它看起来远得多。</strong>",
    "r2d": "<strong>场景有效性</strong>",
    "r2g": "把它放进值班这种高频场景，它到底有没有减少人工负担？答得「像」不算，<strong>能不能少一次人工介入才算</strong>。",
    "r3d": "<strong>产品统一性</strong>",
    "r3g": "三个 Agent、四个触点、两种执行环境该怎么收敛，才能让用户<strong>不必先理解平台内部怎么分工</strong>。",
    "sec1_co_big": "用户要的是把事做完，不是先学会我们怎么分工。",
    "sec1_co_p": "这一页写的是我在这三层上分别做了什么、以及判断错过什么。<strong>内部规模数据、产品代号、未公开规划不在这里出现</strong>——文末有一节专门写清哪些不写、为什么。",
    "back": "于清程",
    "foot_back": "← 返回主页",
    "hero_meta": "实习 · 小红书 · 中台技术 · 2026.05 — 2026.08 · 北京",
    "hero_title": "AI 基础设施",
    "hero_sub": "复杂度不会消失——它只会换人承担",
    "s1n": "至少 16 项",
    "s1": "由我提出、并由我亲手改代码完成的前端需求。这是按「独立用户问题」逐项去重后的<strong>下界</strong>，不是把需求文档数相加得出的漂亮总数。",
    "s2n": "3 个 Agent",
    "s2": "基础设施 Agent、值班 Agent、平台助手。当三者能力开始重叠时，我提的不是再做第四个，是把它们<strong>收敛到一个入口</strong>。",
    "s3n": "0 → 1",
    "s3": "值班 Agent 是我从真实工单里长出来的场景：问题分类、产品规划、效果评估与持续运营的口径，都由我建立。"
  },
  "en": {
    // EN-ANCHOR
    "sec9_label": "What both tracks were really about",
    "sec9_head": "They look unrelated. Both are the same problem: what the screen says versus what is true.",
    "sec9_p1": "The agent work and the resource work are completely different tracks, but put side by side they turn out to be two versions of one problem. In the six pairs below, the left is what the system or the interface says; the right is the state of the real world — <strong>and that inequality sign in the middle is what this internship was actually about:</strong>",
    "q1a": "The model stopped streaming",
    "q1b": "The file changes were rolled back",
    "q2a": "The tool returned text",
    "q2b": "The remote job actually succeeded",
    "q3a": "The answer was written to the session",
    "q3b": "The message really sent in the channel",
    "q4a": "The conversion request was submitted",
    "q4b": "The node has finished converging",
    "q5a": "Plenty of cards are free",
    "q5b": "A schedulable whole node exists",
    "q6a": "The environment has run for weeks",
    "q6b": "Its GPUs are under-utilised",
    "sec9_co_big": "Which is how I moved from building screen features to defining task state, evidence and recovery paths.",
    "sec9_co_p": "<strong>In a complex product, the definition of \"done\" has to come from the real system — not from a button in the front end or a phrase from a model.</strong> In a system that can execute and cause side effects, the most expensive mistake isn't being slow. It is <strong>letting the user believe something has already happened.</strong>",
    "sec10_label": "Honest boundary",
    "sec10_head": "What I leave out, and what wasn't mine",
    "sec10_p1": "There isn't a single internal scale figure or product code name anywhere on this page. The boundaries go first — <strong>that is what makes the judgements above worth reading.</strong>",
    "b1k": "Internal data",
    "b1v": "Ticket volumes, opportunity-space ratios, cluster size, fragmentation baselines and targets are <strong>all withheld</strong>. This page carries method and definitions only. The one set of numbers that does appear is the effectiveness trend produced by the framework I built — <strong>and I discounted its biases myself, above.</strong>",
    "b2k": "Not built by me",
    "b2v": "I did not build the underlying agent framework, the scheduler, or the resource control plane. In the governance work, the APIs, resource labelling, controller and scheduling implementation were <strong>delivered by the engineering team and are not my development output.</strong>",
    "b3k": "Architecture: I read it, I didn't map it",
    "b3v": "I can explain what WebSocket versus SSE, runtimes, hooks, read versus act, HITL and sessions each constrain, and what those constraints mean for the product. <strong>The architectural write-up of that implementation was done by engineering.</strong>",
    "b4k": "Framework selection: I followed it, I didn't lead it",
    "b4v": "The underlying framework was switched once. That evaluation <strong>was not led by me; I followed it end to end</strong>. It made one thing clear: if I don't understand judgements of that kind, all I can do on the product side is accept the conclusion and stay out of the discussion about what it means for users. <strong>That is the gap I most want to close next.</strong>",
    "b5k": "How far things went",
    "b5v": "\"Developed\" means I completed the corresponding code change. It <strong>does not automatically mean long-term, fully rolled-out, stable operation</strong>. The governance work produced several PRD versions, an end-to-end showcase and a rollout milestone, <strong>but there is no outcome evidence that the fragmentation target was met, and I do not claim any number of cards released.</strong>",
    "b6k": "Never shipped",
    "b6v": "The abort / task-state / lifecycle group was an <strong>exploration that never shipped</strong>. It is on this page because <strong>its lesson is worth more than its result.</strong>",
    "sec11_label": "What the internship left me",
    "sec11_head": "From patching a half-built product, to validating it against real tickets, to arguing for convergence",
    "sec11_p1": "Three shifts: <strong>from adding features to a half-built product, to using real support tickets to test whether an agent has any value at all, to proposing that multiple agents and entry points converge; from asking how much capacity is idle, to understanding contiguity, pooling and who holds allocation authority; and from describing requirements as screens, to defining products as state, evidence, definitions and recovery paths.</strong>",
    "sec11_p2": "What I most want to keep isn't any internal product name. It's one judgement: <strong>the assistant should absorb platform complexity on the engineer's behalf — not repackage the product matrix, the entry-point choice and the differences in execution environment and hand them all back.</strong>",
    "sec11_p3": "But it has an equally important other half, and it is the biggest thing I took away: <strong>absorbing complexity is not the same as concealing real state.</strong> The more a system can execute and cause side effects, the more carefully its boundaries, risks and evidence have to be designed. <strong>An assistant that does everything for you but won't tell you how far it got is more dangerous than a CLI that makes you type the command yourself.</strong>",
    "sec8_label": "The other track",
    "sec8_head": "GPU fragmentation: idle, under-utilised and fragmented are three different words",
    "sec8_p1": "On the surface it is one complaint: <strong>\"there are obviously free cards in the cluster, and my whole-node training job still can't get scheduled.\"</strong>",
    "sec8_p2": "The root cause isn't low utilisation. It is a <strong>shape mismatch</strong>: interactive development and training jobs share one pool, and one-, two- and four-card instances end up scattered across different nodes. The cluster may have enough free cards in total for several whole nodes, <strong>while no single node has contiguous whole-node capacity.</strong>",
    "sec8_p3": "So the first thing I did on this track was pull apart three words that get used interchangeably every day: <strong>idle ≠ under-utilised ≠ fragmented.</strong> \"Time running\" is only a proxy indicator for governance; <strong>it is not the same as low utilisation</strong> — an environment that has been up for weeks may well be under constant load. So runtime can screen for opportunities and must not be used to reclaim directly. I pressed that point hard in the doc, because the moment it gets treated as a conclusion, the people who get hurt are the ones actually using their resources.",
    "sec8_p4": "I started from a current-state analysis and competitive research — how public-cloud ML platforms such as Alibaba PAI-DSW, Tencent TI-ONE and Volcengine MLP cut this problem — and the proposal went through several versions. The core of it is returning allocation authority to administrators without taking flexibility away from developers:",
    "dg4_alt": "Comparison: in a shared pool small jobs carve a slice out of every node, so total idle capacity exists but no schedulable whole node does; a dedicated pool with compact placement frees complete nodes",
    "dg4_a_t": "Shared pool: training and interactive dev jobs mixed",
    "dg4_n1": "Node A",
    "dg4_n2": "Node B",
    "dg4_n3": "Node C",
    "dg4_side_a": "← taken by small dev jobs",
    "dg4_side_b": "← these two are wholly free; a big job fits",
    "dg4_a_c1": "Total free cards add up to two whole nodes —",
    "dg4_a_c2": "but not one node is completely free.",
    "dg4_b_t": "Dedicated dev pool + compact placement",
    "dg4_b_c1": "The same small jobs, placed together,",
    "dg4_b_c2": "free two whole nodes. Now the big job schedules.",
    "dg4_foot1": "Enough capacity in total does not mean a schedulable whole node exists.",
    "dg4_foot2": "So what has to change isn't average utilisation. It's pool boundaries and placement policy.",
    "dg4_cap": "A schematic — the number of squares is chosen to make the structure legible and <strong>does not represent real cluster size</strong>. The number of occupied cards is identical on both sides; <strong>the only thing that changed is where they sit.</strong> That is the counter-intuitive part of this track: without improving any utilisation figure or reclaiming a single card, changing placement alone lets a previously unschedulable job schedule.",
    "g1d": "<strong>Create a dedicated dev-box pool</strong>",
    "g1g": "Isolated from the training and inference pools. Administrators move resources in <strong>a whole node at a time</strong>. CPU environments don't consume the GPU pool.",
    "g2d": "<strong>Still allow small shapes inside the pool</strong>",
    "g2g": "Inside the dev pool users can still request one, two, four cards or a whole node. <strong>No blunt ban on small shapes</strong> — that just moves the cost onto development speed, and the problem regrows from the other end.",
    "g3d": "<strong>Compact placement within the pool</strong>",
    "g3g": "A small job goes to the node that can hold it and leaves the least room afterwards, <strong>so as to preserve as many complete nodes as possible</strong> for larger jobs.",
    "g4d": "<strong>Controlled conversion between pools + migrating the old entry</strong>",
    "g4g": "Capacity moves with business peaks and troughs, but <strong>only an idle whole node can move back</strong>. The old entry point stops accepting new environments and migrates gradually; a dashboard tracks shape distribution, long-running environments and headroom.",
    "sec8_co_big": "\"Submitted successfully\" on a page does not mean the resource is usable.",
    "sec8_co_p": "Underneath it abstracts into three steps: the management plane records the target pool, a controller converges the node's actual state, and the scheduler reads the final state to enforce isolation. <strong>My product responsibility is to write that asynchronous process out in full</strong>: do source and target match, is the machine wholly idle, is the conversion still in flight, did it actually land, why can a partially occupied node not move back, how do you recover after a failure. <strong>Machine count, card count and quota are three different things too.</strong> And one more: this governance touches two audiences — take only the administrator's view and it becomes a hard restriction; take only the developer's and the training pool keeps getting carved up. <strong>So I drew both journeys separately — the administrator's move-in / observe / move-back, and the developer's choose / create / use / back up / reclaim — and joined the two ends with isolation and scheduling.</strong>",
    "sec7_label": "Layer three · is the product one product",
    "sec7_head": "A single entry point is not a single runtime",
    "sec7_p1": "By this stage three agent scenarios coexisted: the infrastructure agent, the on-call agent, the platform assistant. They fired in different places, but their knowledge, query and diagnosis capabilities were visibly overlapping. <strong>Keep building them separately and each one maintains its own prompts, skills, tool integrations and evaluation — they will drift, guaranteed. And users still have to remember which assistant owns what.</strong>",
    "sec7_p2": "So I proposed merging them. <strong>The motive was not a bigger robot.</strong> It was to cut three costs for engineers: learning the product matrix, choosing an entry point, and switching context.",
    "sec7_p3": "But there is a mistake that is very easy to make here: <strong>one entry point does not mean stuffing every capability into one execution body.</strong> The touchpoints genuinely differ in interaction capability and risk. The clearest case is the sidebar. It runs single-turn SSE, and <strong>human-in-the-loop needs an upstream channel that carries the user's decision back to where execution is happening</strong>. SSE is one-way: once the request is out, the user can only watch. Approvals, aborts and extra input cannot get in, and because each turn is an independent request, multi-turn state has nothing natural to hang from.",
    "sec7_p4": "<strong>That isn't a defect. It's positioning.</strong> The sidebar should carry exactly the tasks that need no mid-flight intervention; anything needing approval or abort should be routed to the full-screen form. <strong>The real product error would be claiming the two touchpoints have the same capabilities.</strong>",
    "dg3_alt": "Structure: under one unified entry point, four touchpoints each keep their own transport, execution environment and risk boundary",
    "dg3_top": "Unified assistant · what is unified is discovery, identity and context",
    "dg3_c1s": "WebSocket · bidirectional, multi-event",
    "dg3_c1t": "Full workbench",
    "dg3_c1a": "Complex multi-turn tasks",
    "dg3_c1b": "Tool state, abort",
    "dg3_c1c": "HITL: approve / clarify / resume",
    "dg3_c2s": "SSE · one-way, push only",
    "dg3_c2t": "Platform sidebar",
    "dg3_c2a": "Current page context, light single turn",
    "dg3_c2b": "No upstream channel: approvals,",
    "dg3_c2c": "aborts and extra input can't get in",
    "dg3_c2d": "down yes, up no",
    "dg3_c3s": "Asynchronous · where the problem is",
    "dg3_c3t": "Group chat",
    "dg3_c3a": "On-call triggering, human collaboration",
    "dg3_c3b": "Weak display and interaction",
    "dg3_c3c": "Good for human handover",
    "dg3_c4s": "Long-running · isolated environment",
    "dg3_c4t": "Cloud dev box",
    "dg3_c4a": "Code, files, terminal",
    "dg3_c4b": "Tasks that need a container",
    "dg3_c4c": "Escalates from a light entry point",
    "dg3_up": "Needs approval or abort → route it up to the full-screen form (don't pretend the touchpoints are equivalent)",
    "dg3_foot": "For the user, the entry point is unified. For the system, the runtimes and permission boundaries stay distinct.",
    "dg3_cap": "What this diagram argues is that <strong>the thing to converge is the entry point, not the execution body</strong>. Only four things need to be unified on the user's side: capability discovery, entry-point mental model, identity, context. Transport, execution environment and permission boundaries are allowed to differ, because they really do differ. <strong>Translating a technical constraint (SSE has no upstream channel) into a product position (the sidebar only takes tasks needing no intervention) is, to me, the most valuable thing a PM does in systems like this.</strong>",
    "ss1k": "Same channel appends",
    "ss1v": "A follow-up question from the same user in the same channel appends to the same session.",
    "ss2k": "Isolated across channels and people",
    "ss2v": "The same user in a different channel gets a separate session, <strong>so context can't bleed across groups</strong>; different users are isolated from each other.",
    "ss3k": "Only sync what actually happened",
    "ss3v": "Show only what the user explicitly addressed to the agent, and <strong>answers that were successfully delivered</strong>; filter chat noise, internal tool steps and failed drafts. <strong>An answer that failed to send must never appear in the unified session as delivered.</strong>",
    "ss4k": "Read-only by default on the platform side",
    "ss4v": "So that context from a chat never silently becomes high-risk execution permission. <strong>A session isn't just an array of messages</strong> — it should also carry task state, key tool results, artefacts, approvals and interruption points, even if each touchpoint renders them differently.",
    "sec6_label": "Layer two · does it work in the scenario",
    "sec6_head": "0 → 1 on an on-call agent: define the metrics first, then start analysing",
    "sec6_p1": "I picked on-call support because it satisfies four conditions at once: <strong>it is real, high-frequency, reviewable, and it already has a human workflow running.</strong> Without a human baseline there is nothing to evaluate against — you can only prove the thing can talk.",
    "sec6_p2": "And in this scenario, <strong>an agent sounding right is worth nothing</strong>. Either it resolves the ticket, or it points in the right direction and reduces human involvement, or at minimum it doesn't mislead. So I started from historical tickets — classification and opportunity analysis — and then designed its triggers, knowledge, tools and human-handover path. (Backend integration and service implementation were engineering's.)",
    "sec6_q": "A showcase of great cases proves the ceiling of what an agent can do. It doesn't prove the product form stands up. So what I wanted was the distribution of real tickets, not a handful of beautiful cases.",
    "sec6_p3": "The frame I used was two-dimensional: <strong>problem difficulty</strong> (standard knowledge and operations / needs context or multi-step judgement / needs an expert or crosses systems) × <strong>degree of human involvement</strong> (agent alone / light human confirmation / human supplies the key judgement / human leads throughout). Its job is to <strong>stop a single \"resolution rate\" from hiding the structure of the problem</strong>: on a hard ticket, an agent that gathers the environment and rules out the usual causes has value even without closing it; on an easy ticket, if a human still has to correct it, the product has failed.",
    "sec6_p4": "Which is why I never looked at \"response rate\" alone. I broke it into four metrics — <strong>and this was the single most important step, because once the metrics are wrong, every analysis afterwards works hard in the wrong direction:</strong>",
    "k1d": "<strong>Resolved alone</strong>",
    "k1g": "The agent closed the ticket itself, with no human taking over.",
    "k2d": "<strong>Useful contribution</strong>",
    "k2g": "Either resolved it, or pointed in the right direction. <strong>Far stricter than a response rate — answering in the wrong direction is not a contribution.</strong>",
    "k3d": "<strong>Misled</strong>",
    "k3g": "Gave a wrong direction that a human had to correct. <strong>It has to be read together with useful contribution</strong>, or \"answering more eagerly\" may just be manufacturing more cleanup work.",
    "k4d": "<strong>Degree of human involvement</strong>",
    "k4g": "Scored on the four tiers above and averaged (1 = agent alone, 4 = human throughout). <strong>It measures not how good the answers were but how much less work people did</strong> — which is what this product actually gets paid for.",
    "sec6_co_big": "Three consecutive weeks: useful contribution 69.3% → 74.7% → 88.3%; misled 27.1% → 20.9% → 10.3%.",
    "sec6_co_p": "Over the same period the mean degree of human involvement fell from <strong>2.46 to 1.84</strong>, about 25%. <strong>But this set has to be discounted, and I discount it myself first</strong>: some tickets have no clear closing signal, so \"the user went quiet\" may be counted as resolved; the classification involves human labelling and therefore subjectivity; ticket composition shifts between periods; and failures caused by the system being unavailable can land in the same negative bucket as knowledge errors. <strong>So this is an iteration signal, not an unbiased causal result.</strong> One more boundary: I followed one full week of on-call end to end; for the other periods I kept observing and analysing the data, <strong>but I did not confirm every single ticket by hand.</strong>",
    "sec6_head2": "Freeze the definitions, don't re-copy the instructions",
    "sec6_p6": "An analysis went out every week, and the thing to fear there isn't slowness — it's <strong>this week's definitions differing from last week's</strong>. Once the definitions drift, the trend means nothing. So I froze the repeatable process into a skill spec, so that every run uses the same scope and the same definitions:",
    "sk1k": "Trigger",
    "sk1v": "Only fires when someone needs to review on-call tickets over an explicit time range, or generate the weekly report. <strong>Not every conversation should summon it.</strong>",
    "sk2k": "Data scope",
    "sk2v": "Only ticket-related messages, in named channels, inside a named time window. <strong>It never expands into unrelated conversations</strong> — an analysis with runaway scope is not an analysis.",
    "sk3k": "Counting rules",
    "sk3v": "How duplicate tickets collapse; what counts as resolved alone / useful contribution / misled; how a missing closing signal gets flagged. <strong>Definitions live in the process, not in someone's memory each week.</strong>",
    "sk4k": "Failure fallback",
    "sk4v": "When a fetch is incomplete, a field is missing, or messages can't be linked, <strong>keep the gap flagged and return to human verification — never let the model fill the hole itself.</strong> I think this is the most important line in the whole spec.",
    "sec5_label": "One exploration that never shipped",
    "sec5_head": "That abort button taught me the state machine has to come before the UI",
    "sec5_p1": "I started from one error on abort and ended up in session state, tool events, remote side effects and resume semantics. The core problem is very real: <strong>stopping the model's stream does not undo file changes that already happened, and does not stop a remote job.</strong> If the task has already produced side effects, a UI that says \"stopped\" is handing the user a false sense of safety.",
    "sec5_p2": "I produced a whole set of analysis and proposals for it: the long-task black box, second confirmation on abort, tool execution state, what to say about state after a stop. <strong>None of it shipped.</strong> So it cannot be written up as \"drove it to launch\" or \"delivered the redesign\", and it is not part of the 16 above.",
    "sec5_p3": "What it left behind is worth more to me than a shipped button. <strong>First: the state machine has to come before the UI.</strong> The abort button kept getting more complicated precisely because I started from the screen, and only then discovered that the model, the tools, the files and the remote job each have their own lifecycle. <strong>Second: past a certain point you have to judge return on effort, rather than keep escalating because the proposal happens to be yours.</strong> The second one is much harder to actually do.",
    "sec5_q": "Draw the intended state, the real state, the async events, the side effects, the compensations and the recovery paths — then design the page. I learned that order by getting it wrong.",
    "sec4_label": "Layer one · does the single product work",
    "sec4_head": "Start from what users don't know how to ask, not from what looks ugly",
    "sec4_p1": "Infrastructure tasks have heavy inputs: to run one training job you need a model, data, a resource spec, concurrency, an output location. <strong>Putting a new user in front of an empty text box hands him the platform knowledge and the prompt-writing cost at the same time</strong> — he isn't unwilling. He <strong>doesn't know what to ask for</strong>.",
    "sec4_p2": "So I turned the high-frequency tasks into scenario templates: one click gives you <strong>an editable fill-in-the-blanks</strong>, covering API onboarding, data processing, training, deployment and batch inference. A template asks only for what the task genuinely needs, and spells out the inputs people get wrong — attachments, paths.",
    "sec4_p3": "Around that I built a set of interactions: click-to-select a placeholder, a large input for long text, a warning for placeholders left unfilled, and a short window in which you can send anyway. <strong>The goal was never to turn the chat box into a form</strong> — free expression has to stay; it just shouldn't let people trip over trivial mistakes. <strong>The system warns first, and the final call stays with the user.</strong>",
    "sec4_p4": "Added up, this layer is <strong>at least 16 front-end requirements and fixes that I proposed and then implemented in code myself</strong>. But the more interesting part isn't the number — it's <strong>how it was counted</strong>. How a PM arrives at a number tells you more about whether to trust him than the number does:",
    "f1d": "<strong>One capability split across many implementations counts once</strong>",
    "f1g": "In code, \"copy\" is one underlying utility plus several buttons. Counted by files it's several items; counted by the problem the user hit, it is exactly one — <strong>he can't copy.</strong>",
    "f2d": "<strong>Later fixes fold into the original requirement</strong>",
    "f2g": "After turn navigation shipped I changed first/last highlighting, the display threshold and overlap handling. That is one requirement being improved, not three new ones. <strong>Splitting one iteration into three is the most common way numbers get padded.</strong>",
    "f3d": "<strong>Shipped together but solving different problems counts separately</strong>",
    "f3g": "Click-to-select and the large text input were built in one pass, but one solves \"editing the template is tedious\" and the other \"I can't see long content\". <strong>Two user problems, two items.</strong>",
    "f4d": "<strong>Anything that didn't ship doesn't count. Neither does code I didn't write.</strong>",
    "f4g": "The whole abort-and-task-state group never shipped, so it is not in the 16. Testing, user analysis, competitive research and evaluation docs don't get to pose as development either. <strong>Which is why 16 is a floor, not a ceiling.</strong>",
    "sec4_co_big": "I wrote this front-end code with an AI coding tool. The discipline around it is mine.",
    "sec4_co_p": "I wrote the constraints into the project's AI collaboration rules: <strong>review the relevant code and the blast radius before touching anything; bound the change and prefer the smallest verifiable one; before building UI, learn the styling of other modules in the same project instead of inventing a second visual language; keep files small and legible.</strong> The loop is: break down the requirement and its acceptance criteria → have the assistant read the surrounding code → change in small steps → inspect the diff and the edge states → verify in an isolated environment → open a code review → revise on feedback → pipeline verification → post-release walkthrough. <strong>AI raises implementation speed. It simultaneously amplifies three risks: runaway scope, duplicated logic, and looking finished. So using it demands stricter discipline than writing it by hand.</strong>",
    "sec3_label": "Why the word is \"speed\", not \"simple\"",
    "sec3_head": "Complexity never disappears. It only changes who carries it.",
    "sec3_p1": "I rarely say \"make the product simpler\", because it points at nothing you can act on. <strong>What actually determines how a platform feels is the gap between two speeds.</strong> The platform keeps adding capabilities, so new concepts are produced continuously. If the work of absorbing that complexity moves slower than the rate it is produced, <strong>the difference is automatically deposited onto the user.</strong>",
    "sec3_p2": "Nobody is the villain here. <strong>No one has to do anything wrong — as long as the platform outruns the encapsulation, the user's learning burden rises monotonically.</strong> It also explains something you see constantly: the platform gets more powerful while satisfaction falls. The features aren't bad. Absorption lost the race against production.",
    "sec3_p3": "So my goal was never \"make the interface simple\". It was <strong>make the absorbing faster</strong>: when the platform ships a new capability, users shouldn't have to wait for us to redesign a screen, write a doc and run a training session before they dare use it.",
    "sec3_q": "\"In the age of AI, if you learn slowly enough, you won't have to learn it at all.\" — a joke, but it points at something real: new concepts now arrive faster than any human learns. Which means the fix isn't asking users to keep up. It's absorbing it for them.",
    "dg2_alt": "Schematic: the platform produces complexity faster than the product absorbs it, and the gap between the two curves is the learning burden the user has to carry",
    "dg2_y": "Cumulative complexity",
    "dg2_x": "Time",
    "dg2_l1": "Rate the platform produces complexity",
    "dg2_g1": "The gap =",
    "dg2_g2": "what the user has to learn alone",
    "dg2_l2": "Rate the product absorbs it",
    "dg2_foot": "No one has to do anything wrong. If the platform outruns the encapsulation, the burden only grows.",
    "dg2_cap": "This is a schematic, not measured data — <strong>it is about the shape, not the values</strong>. Both lines rise: the platform gets stronger and the product does keep up. But as long as the slopes differ, the shaded area only widens. <strong>That area doesn't vanish. It becomes somebody's learning cost.</strong> On a platform team, I think the rate that shaded area grows is the thing to watch.",
    "sec3_co_big": "Product design is a passive art.",
    "sec3_co_p": "Any design that makes a user stop and work something out is, in effect, raising your own barrier and lowering your own conversion. <strong>Nobody should have to work out which product a capability belongs to, which entry point to use, or what resources it needs first, in order to use it.</strong> That sounds like consumer-product common sense, but it bites harder on an internal platform: an engineer's time has a price he can calculate. If it's annoying he simply doesn't use it — he goes back to the handful of commands he already knows. <strong>No feedback, no complaint. Just silent churn.</strong>",
    "sec2_label": "The call at the centre of it",
    "sec2_head": "The CLI and the assistant aren't side by side. One sits on top of the other.",
    "sec2_p1": "Early in the work on the new platform front end there was a tempting option on the table: <strong>retire the command-line entry point altogether</strong>. The argument sounds clean — we have a natural-language assistant now, so who is going to memorise commands?",
    "sec2_p2": "My read was the opposite. <strong>The CLI's value is invoking platform capabilities deterministically and composably. The assistant's value is understanding intent and orchestrating those capabilities. Those are two layers, not two competing products.</strong> Cut the lower one and the upper one has no reliable hands and feet — the assistant degrades into a shell that can only talk.",
    "sec2_p3": "So the conclusion: <strong>the CLI isn't going away and shouldn't be weakened — it needs to become more rigorous and more callable by programs. What changes is who uses it, not what it is worth: its primary user should shift from a person to an AI.</strong>",
    "dg1_alt": "A comparison: treating the CLI and the assistant as two parallel entry points, versus understanding them as two stacked layers",
    "dg1_a_t": "Treated as two parallel entry points",
    "dg1_a_u": "User: has to pick one first",
    "dg1_a_l": "CLI",
    "dg1_a_r": "Assistant",
    "dg1_a_c1": "The cost of choosing lands back on the user: which entry point can",
    "dg1_a_c2": "execute, which can only answer — and their capabilities overlap.",
    "dg1_b_t": "What it actually is: two layers",
    "dg1_b_1": "User · states a goal, nothing else",
    "dg1_b_2": "Assistant · reads intent, orchestrates",
    "dg1_b_3": "CLI · deterministic, composable execution",
    "dg1_b_4": "Platform · training / eval / deploy / resources",
    "dg1_n1": "Its value is understanding what you want,",
    "dg1_n2": "then deciding what to call and in what order.",
    "dg1_n3": "Its value is being deterministic and composable.",
    "dg1_n4": "Which is why it shouldn't be weakened — it has to get",
    "dg1_n5": "stricter and more callable. Its user is now a model.",
    "dg1_cap": "<strong>All four diagrams on this page are mine</strong> — this work has no screenshots I can publish, so I drew the judgements instead. The reading on the left keeps adding entry points. The reading on the right adds exactly one layer — and because the lower layer's user is now a model, it has to be specified more strictly than it ever was for humans.",
    "sec2_co_big": "I later read that agent's implementation. It is already built this way.",
    "sec2_co_p": "It has almost no tools of its own — the platform capabilities are still the same command-line tools; it's just that a model is typing the commands now. <strong>What convinced me the direction was right wasn't how neatly it reasoned. It was seeing it already running that way, and understanding why it was designed that way.</strong> (The architectural write-up of that implementation was done by engineering.)",
    "sec1_label": "Where I came in",
    "sec1_head": "Nothing was missing. Users just had to assemble the product map themselves.",
    "sec1_p1": "By the time I arrived the platform had most of what it needed: a CLI carrying training, evaluation, deployment and resource operations; cloud dev boxes providing code, files, a terminal and long-running environments; a half-built agent that could already reach some platform capabilities through natural language; and query, diagnosis and knowledge features scattered across pages and group chats.",
    "sec1_p2": "So the problem was never that nothing existed. <strong>The problem was that an engineer had to answer a set of product questions before he could start on his own one</strong>: do I use the CLI, the web app, a dev box, or the agent? Can this entry point execute, or only answer? If I switch, does my context come with me? Why does the same capability appear in three different assistants?",
    "sec1_p3": "Every one of those answers lives inside the platform's org chart — <strong>and users have no reason to know our org chart.</strong> So the first thing I did was not to take requests. It was to redefine the problem in three layers:",
    "r1d": "<strong>Does the single product work</strong>",
    "r1g": "Is that half-built agent genuinely usable, or only demonstrable? <strong>The distance between those two is much longer than it looks.</strong>",
    "r2d": "<strong>Does it work in the scenario</strong>",
    "r2g": "Dropped into something as high-frequency as on-call support, does it actually reduce human load? Sounding right doesn't count. <strong>One less human intervention counts.</strong>",
    "r3d": "<strong>Is the product one product</strong>",
    "r3g": "How do three agents, four touchpoints and two execution environments converge so that <strong>users never have to learn how the platform is organised internally</strong>.",
    "sec1_co_big": "People want to get the thing done. They don't want to learn our org chart first.",
    "sec1_co_p": "This page is what I did across those three layers, and what I got wrong. <strong>Internal scale figures, product code names and unreleased plans do not appear here</strong> — there is a section at the end setting out exactly what I leave out, and why.",
    "back": "Qingcheng Yu",
    "foot_back": "← Back to portfolio",
    "hero_meta": "Internship · Xiaohongshu (RED) · Platform Engineering · May – Aug 2026 · Beijing",
    "hero_title": "AI Infrastructure",
    "hero_sub": "Complexity never disappears. It only changes who carries it.",
    "s1n": "16+",
    "s1": "front-end requirements I proposed and then wrote the code for myself. A deduplicated <strong>floor</strong>, counted one distinct user problem at a time — not a flattering total reached by adding up documents.",
    "s2n": "3 agents",
    "s2": "An infrastructure agent, an on-call agent, a platform assistant. Once their capabilities began to overlap, what I proposed was not a fourth one — it was <strong>collapsing them into a single entry point</strong>.",
    "s3n": "0 → 1",
    "s3": "The on-call agent grew out of real support tickets. The problem taxonomy, the product plan, and the evaluation framework with all its definitions are mine."
  }
};
let lang = 'zh';
function applyLang(l) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T[l][el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;
  });
  document.getElementById('lang-btn').textContent = l === 'zh' ? 'EN' : '中文';
  document.documentElement.lang = l === 'zh' ? 'zh' : 'en';
}
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('site-lang', lang);
  applyLang(lang);
}
lang = localStorage.getItem('site-lang') || 'zh';
applyLang(lang);
</script>
