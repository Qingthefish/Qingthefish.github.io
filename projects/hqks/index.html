  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F7F4; --text: #1A1918; --muted: #8C8880;
      --light: #B8B4AE; --border: #E0DDD6; --border-light: #EDEAE4;
      --serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
      --sans:  'Inter', -apple-system, 'PingFang SC', sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 400; line-height: 1.75; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 48px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 64px; background: rgba(248,247,244,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); }
    .nav-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-back { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .nav-back:hover { color: var(--text); }
    #lang-btn { font-size: 0.72rem; letter-spacing: 0.08em; background: none; border: 1px solid var(--border); padding: 5px 14px; cursor: pointer; color: var(--muted); transition: all 0.2s; border-radius: 2px; }
    #lang-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* HERO */
    .hero { padding: 140px 0 80px; border-bottom: 1px solid var(--border); }
    .hero-meta { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--light); margin-bottom: 28px; }
    .hero-title { font-family: var(--serif); font-size: clamp(3rem, 7vw, 6rem); font-weight: 300; line-height: 1.05; margin-bottom: 20px; }
    .hero-sub { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--muted); margin-bottom: 40px; }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--border); color: var(--muted); border-radius: 2px; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); }
    .stat { padding: 52px 40px; border-right: 1px solid var(--border-light); }
    .stat:last-child { border-right: none; }
    .stat-num { font-family: var(--serif); font-size: 3.2rem; font-weight: 300; line-height: 1; margin-bottom: 10px; }
    .stat-label { font-size: 0.75rem; color: var(--muted); line-height: 1.6; }

    /* CONTENT */
    section { padding: 80px 0; border-bottom: 1px solid var(--border); }
    .sec-label { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--light); margin-bottom: 48px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
    .two-col { display: grid; grid-template-columns: 300px 1fr; gap: 80px; align-items: start; }
    .col-head { font-family: var(--serif); font-size: 1.8rem; font-weight: 300; line-height: 1.3; }
    .col-body { font-size: 0.88rem; color: #635F5A; line-height: 1.9; }
    .col-body p + p { margin-top: 16px; }
    .col-body strong { color: var(--text); font-weight: 500; }

    /* CALLOUT */
    .callout { border-left: 2px solid var(--text); padding: 4px 0 4px 24px; margin-top: 40px; }
    .callout .big { font-family: var(--serif); font-size: 1.3rem; line-height: 1.45; color: var(--text); margin-bottom: 12px; }
    .callout p { font-size: 0.85rem; color: #4E4A45; line-height: 1.9; }
    .callout strong { color: var(--text); font-weight: 500; }
    .quote { border-left: 2px solid var(--border); padding-left: 22px; margin-top: 28px; font-family: var(--serif); font-size: 1.08rem; font-style: italic; color: #4E4A45; line-height: 1.7; }

    /* FIGURE */
    .fig { margin-top: 52px; }
    .fig img { width: 100%; display: block; border: 1px solid var(--border-light); background: #fff; }
    .fig figcaption { margin-top: 14px; font-size: 0.76rem; color: var(--muted); line-height: 1.75; }
    .fig.narrow { max-width: 460px; }
    .fig-2 { margin-top: 52px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 34px; align-items: start; }
    .fig-2 figure { margin: 0; }
    .fig-2 img { width: 100%; display: block; border: 1px solid var(--border-light); background: #fff; }
    .fig-2 figcaption { margin-top: 13px; font-size: 0.75rem; color: var(--muted); line-height: 1.7; }

    /* ROUNDS */
    .rounds { margin-top: 44px; border-top: 1px solid var(--border-light); }
    .round { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 34px; padding: 24px 0; border-bottom: 1px solid var(--border-light); align-items: start; }
    .round-n { font-family: var(--serif); font-size: 1.7rem; font-weight: 300; color: var(--light); line-height: 0.9; }
    .round-did { font-size: 0.84rem; color: var(--text); line-height: 1.8; }
    .round-did strong { font-weight: 500; }
    .round-got { font-size: 0.84rem; color: #706C67; line-height: 1.8; }
    .round-got strong { color: var(--text); font-weight: 500; }

    /* BOUNDS */
    .bounds { margin-top: 44px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border-light); border: 1px solid var(--border-light); }
    .bound { background: var(--bg); padding: 26px 30px; }
    .bound-k { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--light); margin-bottom: 10px; }
    .bound-v { font-size: 0.83rem; color: #635F5A; line-height: 1.85; }
    .bound-v strong { color: var(--text); font-weight: 500; }

    /* FOOTER */
    .page-footer { padding: 56px 0; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; }
    .footer-back { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .footer-back:hover { color: var(--text); }
    .footer-copy { font-size: 0.7rem; color: var(--light); }

    @media (max-width: 840px) {
      .container { padding: 0 24px; }
      .two-col, .stats, .bounds, .fig-2 { grid-template-columns: 1fr; }
      .fig-2 { gap: 30px; }
      .fig.narrow { max-width: 100%; }
      .stat { border-right: none; border-bottom: 1px solid var(--border-light); padding: 36px 0; }
      .round { grid-template-columns: 1fr; gap: 8px; }
      .round-n { font-size: 1.2rem; }
      section { padding: 60px 0; }
    }
    ::selection { background: var(--text); color: var(--bg); }
  </style>
</head>

    "sec2_label": "我的判断",
    "sec2_head": "这个市场缺的不是货，是让新手敢下单的依据",
    "sec2_p1": "开店之后我很快发现，<strong>卡不难进，难的是让一个新人相信你</strong>。这个圈子里全是玩了十几年的老玩家，信息掌握在他们手里。一个新手想买一张卡，得同时判断七件事：这个球员未来怎么样、这个系列的搏点在哪、平行卡的稀有度怎么排、编号高低差多少、这张卡送评值不值、送哪家评级公司、评完了怎么卖出去——<strong>七件事，一件都不透明。</strong>",
    "sec2_p2": "同行大多把这种不透明当成利润来源——<strong>信息差就是差价</strong>。我的判断是反过来更划算：<strong>把定价逻辑摊开给新手看</strong>，他才敢下第一单；而下过第一单、并且发现你没骗他的人，会一直回来。所以从一开始，内容对我就不是营销，是<strong>消除交易摩擦</strong>。",

    "fig2_cap": "举一个「不透明」的具体例子：光「几分算好卡」这一件事，就要跨四家评级公司的分数体系去比——同样叫 Gem Mint，在 BGS 是 9.5 分，在 PSA 是 10 分。这是我当时做的档位对照表，<strong>红色箭头是我自己标上去的</strong>。（右下角是我们公众号的水印）",

    "sec2_co_big": "新手在这个圈子里最怕的不是买贵，是被当韭菜。",
    "sec2_co_p": "所以信任建立不在话术上，只能建立在「<strong>我先让你看懂，再让你买</strong>」。我后来做的全部内容——入门指南、评级说明书、成交价盘点、标准对照——本质上都是同一个动作：<strong>把老玩家垄断的信息，免费公开出去。</strong>",

    "sec3_label": "怎么做的",
    "sec3_head": "四类内容，各接一条生意",
    "sec3_p1": "到 2023 年停下时，公众号累计 214 篇原创。它不是一个「顺手发点东西」的号——四类内容各有明确的商业出口，而每一类的出口都不一样：",

    "r1d": "<strong>新手教育。</strong>系统写清球星卡是什么、怎么分类（普卡 / 折射 / 物料 / 签字 / RPA / Logoman）、怎么入手、怎么保存。评级那篇我把增值倍数直接写明：<strong>金标约裸卡的 2–2.5 倍、PSA 10 约 3–3.5 倍</strong>，并用「同分存世量」解释为什么——同为不限量的银折，某新秀 10 分只有 48 张、另一位有 1,231 张，所以前者溢价约 10 倍、后者约 6 倍。",
    "r1g": "这不是科普，是<strong>给送评服务做需求教育</strong>。把「评级为什么值这个钱」讲透，批量送评才有人下单。<strong>先解释清楚，再收钱，转化是顺带发生的。</strong>",
    "r2d": "<strong>价格与数据。</strong>逐期盘点海外拍卖行的截标结果（单期 Top 20 成交价），追踪单卡的完整价格曲线，做事件驱动的价格推演。也为客户查指定球员、指定藏品的成交记录，出行情参考。",
    "r2g": "建立定价上的话语权。<strong>客户信不信你的报价，取决于你是否比他更清楚这张卡的历史成交。</strong>这一层直接支撑代拍与选品——它是整个生意里最像「产品数据分析」的部分。",
    "r3d": "<strong>行业结构。</strong>跟踪上游的权力转移：2021 年 8 月 Fanatics 一举拿下 NBA、MLB、NFL 三大球员工会的独家卡权，帕尼尼与 Topps 借 SPAC 上市的计划因此搁浅，PSA 母公司则连续收购评级技术与数据分析平台。",
    "r3g": "我关心的从来是同一个问题——<strong>这对一家线下卡店意味着什么</strong>。版权换手会改变货源和配额，所以这些判断直接决定我们进什么货、押哪家公司的系列。",
    "r4d": "<strong>社群共创。</strong>年末征集卡友的年度 Top 3 收藏，做资深收藏家与评级师的深度访谈（问题我设计，内容是他们的）。",
    "r4g": "一边把读者变成社区成员，一边<strong>用最低成本拿到一线信息</strong>——老玩家愿意在访谈里告诉你的东西，比任何行业报告都新。",

    "fig3_cap": "公众号后台。左边是每日阅读走势，单篇最高 3,667 次阅读 / 3,072 人；右边是流量来源构成，<strong>这两个多月（2021 年 11 月至 2022 年 1 月）累计 8.6 万次阅读</strong>。这是一个时间窗口，不是历史总量——我手上只有这一段能导出的数据，所以只放这一段。",

    "sec4_label": "最想讲的一件事",
    "sec4_head": "市场里没有标准，我就把标准问出来",
    "sec4_p1": "二手卡交易里有个天天在用、但谁也没定义过的词：<strong>通行品</strong>——意思是「品相正常、可以正常流通的卡」。买卖双方都在用它，可每个人心里的线不一样，于是纠纷不断：卖家说这是通行品，买家收到觉得不是。",
    "sec4_p2": "我做的不是发表自己的看法，而是三件事叠起来。第一，把国内交易平台上一次 <strong>230 人参与的公投</strong>结果拿过来：38.7% 认为 BGS 8 分以上算通行品、30% 认为 8.5 分以上、20.4% 认为 9 分以上。第二，对照 eBay 官方对卡品的分级描述——最高一档 Near Mint or Better 被官方定义为「和刚拆包一样」。第三，把 PSA 与 BGS 两家的分数体系逐档拆开，写清 10 / 9 / 8–7 / 4–6 / 2–3 / 1 分各自意味着什么。",
    "sec4_p3": "三份材料摆在一起，结论自己就出来了：<strong>两家评级公司 7 分以上都属于 Near Mint，与 eBay 的官方描述、以及社区投票的多数意见三方吻合</strong>——所以「8 分以上算通行品」这个说法站得住，而且有依据可引。",

    "fig4a_cap": "那次公投的原始截图，收在我当时那篇文章里：230 人投票，分布一目了然。<strong>这是我手上关于「用户真实分歧」最直接的一份证据</strong>——不是我猜用户怎么想，是用户自己投出来的。（右下角是我们公众号的水印）",
    "fig4b_cap": "另一半材料：交易平台官方的品相分级口径，七个维度（边角、边缘、变色、折痕……）对应四档品相。<strong>把社区投票和官方口径并排放在一起，一个能执行的定义就出来了。</strong>",

    "sec4_co_big": "在一个没有权威定义的市场里，共识本身就是产品。",
    "sec4_co_p": "今天回头看，这件事就是一次<strong>用户研究加标准制定</strong>：先把用户的真实分歧量化出来（投票分布），再拿外部权威去锚定它（官方分级口径），最后给出一个双方都能接受、可执行的说法。<strong>我没有发明标准——我把一个已经存在、但没人写下来的标准写了下来。</strong>而写下来的那个人，就成了被引用的那一方。",

    "sec5_label": "一个具体的分析",
    "sec5_head": "纪录片播出，卡价会涨——但涨的是热度，不是价值",
    "sec5_p1": "2020 年乔丹纪录片《最后一舞》播出，带火了他的卡。我把最经典的那张 1986 Fleer 乔丹 PSA 10 的完整曲线拉出来：<strong>播出前（2020 年 1 月）约 4 万美金 → 播到四月涨到近 7 万 → 十集播完冲上 8.51 万的历史新高 → 随后两周回落到 5.1 万。</strong>在峰值接货的人，两周就被套住了。",
    "sec5_p2": "但曲线没有停在这里。一年后，同一张卡拍出 <strong>72 万美金</strong>，之后稳定在 <strong>40 万</strong>上下。也就是说：<strong>纪录片带来的是一次注意力脉冲，真正的价值重估发生在长得多的周期里——两者的形状完全不同。</strong>",
    "sec5_p3": "2021 年底，我用这条曲线去推第二年即将上映的科比纪录片。参照物是 1996-97 Topps Chrome 科比新秀折射 PSA 10：<strong>2020 年 9 月 7.51 万 → 2021 年 3 月冲上 39 万的历史新高 → 2021 年 8 月回落到 13.78 万。</strong>我当时给出的判断是：纪录片会重新拉起热度、终结当时市场对科比卡价格下跌的恐慌，但回调本身是健康的——<strong>别在脉冲的顶上接货。</strong>",
    "sec5_q": "「市场不会永远增长，适当的回调也是健康的。」——这句是我在整个卡市最疯的时候写下的。",
    "sec5_p4": "这套方法能迁移的部分与球星卡无关：<strong>在任何靠共识定价的市场里，一个外部事件先改变的是注意力，不是价值。</strong>分不清这两者，就会把注意力的峰值当成价值的新基准线——这是那两年我见过最多人赔钱的方式。",

    "fig5_cap": "定价这件事落到日常，就是这样一条一条比：同一张卡在 eBay 上的多条在售与成交价并排看，才知道自己该报多少。<strong>为客户查指定球员、指定藏品的行情，用的就是这个动作</strong>——但客户是谁、藏品是什么，不在这里出现。（右下角是我们公众号的水印）",

    "sec6_label": "结果",
    "sec6_head": "三个平台，一个人的选题与脚本",
    "sec6_p1": "公众号 <strong>214 篇原创、2,805 位关注者</strong>；抖音 <strong>8,891 粉丝、累计 7.9 万获赞，单条最高 1.5 万赞</strong>；小红书 <strong>2,793 粉丝、7,418 赞与收藏</strong>。三个平台分工不同：公众号写深度（评级方法、行业结构、拍卖数据），抖音和小红书做卡片鉴赏、开箱和热点解读。",
    "sec6_p2": "选题、稿子、视频脚本都是我自己出，拍摄我协调团队完成。选题来源之一是后台私信——《球星卡新手入门指南》那篇的开篇第一句就是「最近后台收到了许多小伙伴的私信，十分想了解球星卡，但不知从何入手」。<strong>这一页引用的是这 214 篇里的代表作抽样，不是全量。</strong>",

    "fig6a_cap": "公众号后台的账号卡：原创内容 <strong>214</strong> 篇、总用户数 <strong>2,805</strong>。",
    "fig6b_cap": "抖音主页：<strong>7.9 万获赞、8,891 粉丝</strong>。简介里写着欢迎大家来线下实体店体验拆卡的乐趣——线上导线下，是这门生意的基本盘。",
    "fig7a_cap": "抖音作品墙。单条最高 1.5 万赞的是「一百万的卡到底长什么样」；其余多在一千到六千赞之间。<strong>选题几乎都是从「新手最想知道什么」倒推出来的</strong>——不同球员的签名长什么样、黑心福包与良心福包的区别、Prizm 究竟有多少个版本。",
    "fig7b_cap": "小红书笔记墙，路线不同：更偏卡市行情与判断——「哈登魔力不再，卡价暴跌？」「三球和莫兰特有多大差距？」<strong>同一批素材，在不同平台要换一套讲法。</strong>",

    "sec7_label": "为什么在 2023 年 7 月停下",
    "sec7_head": "不是关门，是模式换了、我该回去读书了",
    "sec7_p1": "两年之后，这门生意的规模已经起来了，而<strong>线下单店的天花板也很清楚</strong>：group breaking 这种玩法天生属于线上——只有直播才能同时容纳几十个买家，而专门的平台在流量、支付、纠纷处理上都比一间店做得好。所以业务重心转到了线上的专业平台。",
    "sec7_p2": "同一时间，我攒够了继续读书的钱。<strong>这两年挣的钱，就是我回学校念完学位的学费</strong>——这也是我一开始做这件事的原因。2023 年 7 月，我把经营交接出去，回学校。",
    "sec7_p3": "但我没有真的离开：<strong>到今天我仍然和他们保持交流，业务上的判断还会一起讨论。</strong>这段生意不是失败关停的，是换了形态继续在跑。",

    "sec8_label": "诚实的边界",
    "sec8_head": "哪些我不写，以及为什么",
    "sec8_p1": "这一段里有很多东西涉及别人的钱和别人的收藏。我把不能写的先说清楚——<strong>前面那些才可信。</strong>",

    "b1k": "经营数据",
    "b1v": "门店由合伙人出资、我负责经营，我们按约定分成。<strong>营收、利润、分成比例一律不披露</strong>——那不只是我一个人的信息。",
    "b2k": "客户信息",
    "b2v": "我确实为客户做过指定球员、指定藏品的成交数据检索与行情参考。<strong>客户身份、藏品明细、我给他们做的表格，全部不公开。</strong>",
    "b3k": "评级机构",
    "b3v": "与 PSA / BGS 的关系是<strong>批量送评通道</strong>——成批把客户的卡寄去封壳评级。<strong>这不是品牌授权，也不是战略合作。</strong>（另外说明：我们公众号的英文名 Collector Universe 是自己取的品牌名，与 PSA 母公司无关。）",
    "b4k": "素材范围",
    "b4v": "本页引用的是 214 篇里的代表作抽样；后台数据是我能导出的那个时间窗口。<strong>没有的数字我留空，不估、不补。</strong>",

    "sec9_label": "这两年留下什么",
    "sec9_head": "我对「内容影响决策」的理解，是在这里长出来的",
    "sec9_p1": "最直接的一条：<strong>用户买的从来不只是那件商品。</strong>他在看故事、看趋势、看社区里别人怎么评价这个球员、这张卡。一个卡贩子只需要知道行价，但要让人下单，你得参与他判断价值的那个过程。这件事后来变成我看内容产品的默认视角——也是我为什么最终去了内容平台做产品。",
    "sec9_p2": "第二条更能迁移到我今天做的事：<strong>不透明的市场需要一把可解释的尺子。</strong>球星卡当年没有公开的定价依据，所以内容、评级分数、成交曲线才有价值。今天的 AI 产品处在同一个位置——用户分不出两个模型谁更好、一个智能体的回答该不该信。<strong>「帮用户建立可解释的判断依据」这件事，和我当年写评级说明书是同一件事。</strong>",
    "sec9_p3": "第三条关于用户动机，也是我当年翻译海外行业报告时最受触动的一段：拆卡包的期望回报大多是负的，为什么还有人一直买？三个理由——<strong>可能一发抽中远超成本的卡、可能随时间升值、可能押中一个还没成名的球员</strong>。这解释了所有带随机奖励的产品为什么成立。<strong>今天我做任何带抽卡、激励、游戏化机制的设计，用的还是这套动机模型。</strong>"
  },
  "en": {
    "back": "Qingcheng Yu",
    "foot_back": "← Back to portfolio",

    "hero_meta": "Entrepreneurship · Aug 2021 — Jul 2023 · Xi'an, China",
    "hero_title": "Collector Universe",
    "hero_sub": "Nobody publishes what a card is worth — so we built the yardstick ourselves",

    "s1n": "214",
    "s1": "original long-form pieces on our WeChat account. I chose every topic, ran every interview, wrote every word — and that was one platform out of three.",
    "s2n": "79K",
    "s2": "cumulative likes on Douyin, with one video peaking at 15K. I wrote the copy and the scripts; I ran the shoots.",
    "s3n": "2 years",
    "s3": "full-time. From one shop in Xi'an to a business that outgrew the shop — and this is what paid the tuition that took me back to school.",

    "sec1_label": "The business",
    "sec1_head": "I wasn't selling cards. I was selling certainty in an opaque market.",
    "sec1_p1": "Sports cards are trading cards licensed exclusively by the leagues and players' associations, carrying player autographs or swatches of game-worn jerseys. What makes the market strange is the pricing: <strong>the same card can sell for several times more or less depending on its grade, the player's recent form, and what is happening in the league</strong> — and none of that is published anywhere official.",
    "sec1_p2": "In August 2021 my partner and I opened Collector Universe in Xi'an. He put up the capital; I ran the business — sourcing, content and video, market data, the shop and the community. It had four layers, and each one solved a completely different problem:",

    "m1k": "Inventory",
    "m1v": "Import sealed boxes and cases from overseas, then run <strong>group breaks</strong> — a case is divided into \"spots\", sold to a dozen or more buyers, opened live on stream, and each buyer keeps the cards belonging to the team or slot they drew. <strong>Structurally, it splits one expensive, high-variance bet into shares people can actually afford.</strong>",
    "m2k": "Services",
    "m2v": "<strong>Bulk grading submissions</strong> (shipping clients' raw cards to PSA / BGS in batches to be authenticated and encased), auction consignment, and chasing redemption cards through to fulfilment. Secondary-market services keep people around far better than selling product does.",
    "m3k": "The room",
    "m3v": "The physical shop in Xi'an. What it really sold was not product but <strong>service, and somewhere to talk about cards face to face</strong>. I argued this in a published article back in 2021 — and it turned out to be the part of the business that was hardest to copy.",
    "m4k": "Reach",
    "m4v": "Three channels: WeChat, Douyin, Xiaohongshu. <strong>I picked the topics and wrote the copy and video scripts myself</strong>; I coordinated the crew for filming. The account is called Collector Universe — a brand name we chose ourselves.",

    "fig1a_cap": "Our Xiaohongshu profile. Those three lines of bio — \"beginner guides, great cards to look at, and the latest market moves\" — are literally how we split our content; the line below places us in Xi'an, where the shop was.",
    "fig1b_cap": "This is the kind of thing that passed through our hands: a Kobe Bryant National Treasures Logoman autograph — the only copy in the world (1/1). An NBA logo cut from a game-worn jersey plus the player's signature is the ceiling of this category. (My photo; our account's watermark is bottom right.)",

    "sec2_label": "My read on it",
    "sec2_head": "This market wasn't short of product. It was short of reasons for a beginner to buy.",
    "sec2_p1": "It became clear quickly that <strong>getting cards was easy; getting a newcomer to trust you was not</strong>. The scene was full of collectors who had been in it for a decade, and they held the information. To buy one card, a beginner has to judge seven things at once: how good this player will become, what makes this product line worth opening, how the parallels rank for scarcity, how much the serial number matters, whether the card is worth grading, which grading company to use, and how to sell it afterwards. <strong>Seven judgements, none of them transparent.</strong>",
    "sec2_p2": "Most of the trade treats that opacity as the margin — <strong>the information gap is the profit</strong>. My read was that the opposite pays better: <strong>show a beginner exactly how the pricing works</strong>, and he will place a first order; and someone who places a first order and finds out you didn't take him for a ride keeps coming back. So content was never marketing to me. It was <strong>removing friction from the transaction</strong>.",

    "fig2_cap": "One concrete example of the opacity: just answering \"what grade counts as a good card\" means comparing four grading companies' scales — the same label, Gem Mint, is 9.5 at BGS and 10 at PSA. This is the crosswalk table I put together at the time; <strong>the red arrows are mine</strong>. (Our account's watermark is bottom right.)",

    "sec2_co_big": "What a beginner in this scene fears most isn't overpaying. It's being taken for a mark.",
    "sec2_co_p": "Which means trust can't be built on sales talk. It can only be built on \"<strong>I'll make sure you understand it before I sell you anything</strong>\". Every piece of content I went on to make — beginner guides, grading explainers, sale-price round-ups, standards comparisons — was the same move: <strong>taking the information the veterans had cornered and giving it away.</strong>",

    "sec3_label": "How it ran",
    "sec3_head": "Four kinds of content, each wired to a different part of the business",
    "sec3_p1": "By the time we stopped in 2023 the account had 214 original pieces. It was not a place where we posted whatever came to hand — each of the four content types had a specific commercial outlet, and no two outlets were alike:",

    "r1d": "<strong>Teaching beginners.</strong> What a sports card actually is, how the types break down (base, refractors, patches, autos, RPAs, Logomans), how to start, how to store them. In the grading piece I put the multiples in writing: <strong>a BGS gold label runs about 2–2.5× the raw card, a PSA 10 about 3–3.5×</strong> — and explained why using population counts: for two unlimited-print silver parallels, one rookie had only 48 copies graded 10 while another had 1,231, which is why one carries roughly a 10× premium and the other about 6×.",
    "r1g": "This isn't education for its own sake — it is <strong>demand generation for the grading service</strong>. Explain properly why grading is worth what it costs, and bulk submissions follow. <strong>Explain first, charge second; the conversion happens on its own.</strong>",
    "r2d": "<strong>Prices and data.</strong> Round-ups of overseas auction closings (the top 20 results of each cycle), full price histories for individual cards, and event-driven price reasoning. Also: pulling sale records for a client's specific player or specific card, and writing up what the market was doing.",
    "r2g": "This is where pricing authority comes from. <strong>Whether a client believes your quote depends on whether you know that card's sale history better than he does.</strong> It fed consignment and sourcing directly — the closest thing in the business to product data analysis.",
    "r3d": "<strong>Industry structure.</strong> Tracking power shifting upstream: in August 2021 Fanatics took the exclusive card rights to the NBA, MLB and NFL players' associations in one sweep, which stalled Panini's and Topps' plans to go public via SPAC, while PSA's parent company went on acquiring grading technology and data-analytics platforms.",
    "r3g": "I was always asking the same question of it — <strong>what does this mean for one physical card shop</strong>. Licences changing hands changes supply and allocation, so these calls fed straight into what we bought and which company's product lines we backed.",
    "r4d": "<strong>Building with the community.</strong> A year-end call for readers' top three pickups, plus long interviews with veteran collectors and a professional grader (my questions; their answers).",
    "r4g": "It turned readers into members of something, and at the same time it was <strong>the cheapest first-hand intelligence available</strong> — what a veteran will tell you in an interview is fresher than any industry report.",

    "fig3_cap": "The WeChat back end. On the left, daily readership — the best single piece reached 3,667 reads from 3,072 people. On the right, where the traffic came from: <strong>86,000 reads over these two-and-a-bit months, November 2021 to January 2022</strong>. This is one window, not a lifetime total — it is the slice of data I can still export, so it is the only slice I'm showing.",

    "sec4_label": "The part I most want to explain",
    "sec4_head": "The market had no standard, so I went and asked what it was",
    "sec4_p1": "Second-hand card trading runs on a term everybody uses and nobody has defined: <strong>\"tradeable condition\"</strong> — a card whose condition is normal enough to change hands without argument. Both sides use it, and everybody's line sits somewhere different, so disputes never stop: the seller says it's tradeable, the buyer opens the package and disagrees.",
    "sec4_p2": "I didn't publish my own opinion. I stacked three things on top of each other. First, the results of <strong>a poll of 230 collectors</strong> on a domestic trading platform: 38.7% put the line at BGS 8 or above, 30% at 8.5, 20.4% at 9. Second, eBay's own published condition tiers — its top grade, Near Mint or Better, is officially defined as \"equivalent to a fresh pack\". Third, PSA's and BGS's scales taken apart grade by grade, spelling out what 10, 9, 8–7, 4–6, 2–3 and 1 each actually mean.",
    "sec4_p3": "With all three side by side the answer fell out on its own: <strong>at both grading companies anything 7 or above is Near Mint, which agrees with eBay's official wording and with where the majority of the community voted</strong> — so \"8 and above is tradeable\" holds up, and now it holds up with something to cite.",

    "fig4a_cap": "The original screenshot of that poll, as it ran in my article: 230 votes, the spread visible at a glance. <strong>It is the most direct evidence I have of where users genuinely disagreed</strong> — not my guess at what they thought, but what they voted. (Our account's watermark is bottom right.)",
    "fig4b_cap": "The other half of the material: the trading platform's own condition tiers, seven dimensions (corners, edges, discolouration, creases…) mapped onto four grades. <strong>Put the community's vote next to the official wording and a definition you can actually enforce appears.</strong>",

    "sec4_co_big": "In a market with no authoritative definition, consensus itself is the product.",
    "sec4_co_p": "Looking back, this was <strong>user research plus standard-setting</strong>: quantify where users actually disagree (the vote distribution), anchor it against outside authority (the official tiers), then state a version both sides can live with and act on. <strong>I didn't invent a standard — I wrote down one that already existed and that nobody had written down.</strong> And the person who writes it down becomes the one who gets cited.",

    "sec5_label": "One analysis in full",
    "sec5_head": "A documentary drops and prices rise — but what rose was attention, not value",
    "sec5_p1": "When the Jordan documentary <em>The Last Dance</em> aired in 2020 it set his cards alight. I pulled the whole curve for the canonical one, a 1986 Fleer Jordan in PSA 10: <strong>about $40,000 before it aired in January 2020 → close to $70,000 by April → an all-time high of $85,100 once all ten episodes had run → back down to $51,000 within two weeks.</strong> Anyone who bought at the peak was underwater a fortnight later.",
    "sec5_p2": "But the curve didn't stop there. A year on, the same card sold for <strong>$720,000</strong>, then settled around <strong>$400,000</strong>. Which is the point: <strong>the documentary produced a pulse of attention, while the real re-rating happened over a far longer horizon — and the two have completely different shapes.</strong>",
    "sec5_p3": "At the end of 2021 I used that curve to reason about the Kobe documentary due the following year. The comparable was a 1996-97 Topps Chrome Kobe rookie refractor in PSA 10: <strong>$75,100 in September 2020 → an all-time high of $390,000 in March 2021 → back to $137,760 by August 2021.</strong> The call I made was that the documentary would pull heat back in and end the market's panic about Kobe prices falling — but that the correction itself was healthy, and <strong>you do not buy at the top of a pulse.</strong>",
    "sec5_q": "\"Markets don't rise forever; a correction now and then is healthy.\" — I wrote that at the maddest point of the whole boom.",
    "sec5_p4": "The transferable part has nothing to do with cards: <strong>in any market priced by consensus, an outside event moves attention first, not value.</strong> Confuse the two and you'll treat a spike in attention as the new baseline for worth — which, in those two years, was the single most common way I watched people lose money.",

    "fig5_cap": "Day to day, pricing looks like this: line up every current listing and completed sale for the same card on eBay, and only then do you know what to quote. <strong>Pulling the market on a client's specific player or specific card is exactly this move</strong> — but who the client was and what they owned does not appear here. (Our account's watermark is bottom right.)",

    "sec6_label": "Outcome",
    "sec6_head": "Three platforms, one person's topics and scripts",
    "sec6_p1": "WeChat: <strong>214 original pieces, 2,805 followers</strong>. Douyin: <strong>8,891 followers, 79,000 cumulative likes, top video 15,000</strong>. Xiaohongshu: <strong>2,793 followers, 7,418 likes and saves</strong>. Each channel had a job: WeChat carried depth (grading method, industry structure, auction data), while Douyin and Xiaohongshu did card appreciation, breaks, and reactions to whatever was happening.",
    "sec6_p2": "Topics, copy and video scripts were mine; I coordinated the crew for filming. One source of topics was the inbox — the beginner's guide opens with the line \"we've had a lot of DMs from people who want to understand sports cards and have no idea where to start\". <strong>What this page cites is a representative sample of those 214 pieces, not all of them.</strong>",

    "fig6a_cap": "The account card in the WeChat back end: <strong>214</strong> original pieces, <strong>2,805</strong> total users.",
    "fig6b_cap": "The Douyin profile: <strong>79,000 likes, 8,891 followers</strong>. The bio invites people to come and open packs at the shop — routing online attention to the physical room was the base of the whole business.",
    "fig7a_cap": "The Douyin grid. The 15,000-like video was \"what does a million-dollar card actually look like\"; most of the rest sat between one and six thousand. <strong>Almost every topic was reverse-engineered from what a beginner most wants to know</strong> — what different players' autographs look like, how a fair mystery pack differs from a rigged one, how many versions of Prizm there really are.",
    "fig7b_cap": "The Xiaohongshu grid runs differently — more market read than showcase: \"Harden's lost his magic; are his cards crashing?\", \"How far apart are LaMelo and Morant really?\" <strong>The same material needs a different telling on a different platform.</strong>",

    "sec7_label": "Why it stopped in July 2023",
    "sec7_head": "It didn't close. The model changed, and it was time for me to go back to school.",
    "sec7_p1": "After two years the business had scale, and <strong>the ceiling on a single physical shop was obvious</strong>: group breaking belongs online. Only a livestream can hold dozens of buyers at once, and a dedicated platform beats one shop on traffic, payments and dispute handling. So the centre of gravity moved to a specialist online platform.",
    "sec7_p2": "At the same time, I had saved enough to go back to studying. <strong>What those two years earned is what paid the tuition to finish my degree</strong> — which was the reason I started in the first place. In July 2023 I handed the operation over and went back to school.",
    "sec7_p3": "I didn't really leave, though: <strong>I'm still in touch with them today, and we still talk business calls through together.</strong> This one didn't close down. It changed shape and kept running.",

    "sec8_label": "Honest boundary",
    "sec8_head": "What I won't write here, and why",
    "sec8_p1": "A lot of this involves other people's money and other people's collections. So the things I can't publish go first — <strong>that's what makes the rest of it worth believing.</strong>",

    "b1k": "Financials",
    "b1v": "My partner funded the shop and I ran it, on an agreed split. <strong>Revenue, profit and the split itself are not disclosed</strong> — that information isn't only mine to give.",
    "b2k": "Client information",
    "b2v": "I did pull sale data and write market reads on specific players and specific cards for clients. <strong>Client identities, what they owned, and the sheets I built for them stay private.</strong>",
    "b3k": "Grading companies",
    "b3v": "The relationship with PSA / BGS was a <strong>bulk submission channel</strong> — sending clients' cards in batches to be graded and encased. <strong>It was not a brand licence and not a strategic partnership.</strong> (For the avoidance of doubt: our account name, Collector Universe, is a brand we chose ourselves and has no connection to PSA's parent company.)",
    "b4k": "Scope of evidence",
    "b4v": "This page cites a representative sample of the 214 pieces, and back-end figures from the one window I can still export. <strong>Numbers I don't have are left out — not estimated, not filled in.</strong>",

    "sec9_label": "What the two years left me",
    "sec9_head": "Where my sense of \"content drives decisions\" actually came from",
    "sec9_p1": "The most direct lesson: <strong>a buyer is never only buying the object.</strong> He is reading the story, the trend, and what the community thinks of this player and this card. A dealer only needs to know the going rate; but to get someone to buy, you have to be part of how he arrives at what it's worth. That became my default lens on content products — and a large part of why I ended up doing product at a content platform.",
    "sec9_p2": "The second transfers even more cleanly into what I do now: <strong>an opaque market needs a yardstick people can interpret.</strong> Sports cards had no published basis for price, which is exactly why content, grades and sale curves carried value. AI products sit in the same position today — users can't tell which of two models is better, or whether an agent's answer deserves trust. <strong>Helping users build an interpretable basis for judgement is the same job as writing that grading explainer was.</strong>",
    "sec9_p3": "The third is about motivation, and it came from translating an overseas industry report: the expected return on opening a pack of cards is usually negative, so why do people keep buying? Three reasons — <strong>you might pull a card worth many times the box, it might appreciate over time, or you might catch a player before he becomes a star</strong>. That explains why every product built on random rewards works at all. <strong>Whenever I design anything with pulls, incentives or game mechanics today, that's still the motivation model I use.</strong>"
  }
};
let lang = 'zh';
function applyLang(l) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T[l][el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;
  });
  document.getElementById('lang-btn').textContent = l === 'zh' ? 'EN' : '中文';
  document.documentElement.lang = l === 'zh' ? 'zh' : 'en';
}
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('site-lang', lang);
  applyLang(lang);
}
lang = localStorage.getItem('site-lang') || 'zh';
applyLang(lang);
</script>
