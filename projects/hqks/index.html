<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F7F4; --text: #1A1918; --muted: #8C8880;
      --light: #B8B4AE; --border: #E0DDD6; --border-light: #EDEAE4;
      --serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
      --sans:  'Inter', -apple-system, 'PingFang SC', sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 400; line-height: 1.75; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 48px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 64px; background: rgba(248,247,244,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); }
    .nav-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-back { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .nav-back:hover { color: var(--text); }
    #lang-btn { font-size: 0.72rem; letter-spacing: 0.08em; background: none; border: 1px solid var(--border); padding: 5px 14px; cursor: pointer; color: var(--muted); transition: all 0.2s; border-radius: 2px; }
    #lang-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* HERO */
    .hero { padding: 140px 0 80px; border-bottom: 1px solid var(--border); }
    .hero-meta { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--light); margin-bottom: 28px; }
    .hero-title { font-family: var(--serif); font-size: clamp(3rem, 7vw, 6rem); font-weight: 300; line-height: 1.05; margin-bottom: 20px; }
    .hero-sub { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--muted); margin-bottom: 40px; }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--border); color: var(--muted); border-radius: 2px; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); }
    .stat { padding: 52px 40px; border-right: 1px solid var(--border-light); }
    .stat:last-child { border-right: none; }
    .stat-num { font-family: var(--serif); font-size: 3.2rem; font-weight: 300; line-height: 1; margin-bottom: 10px; }
    .stat-label { font-size: 0.75rem; color: var(--muted); line-height: 1.6; }

    /* CONTENT */
    section { padding: 80px 0; border-bottom: 1px solid var(--border); }
    .sec-label { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--light); margin-bottom: 48px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
    .two-col { display: grid; grid-template-columns: 300px 1fr; gap: 80px; align-items: start; }
    .col-head { font-family: var(--serif); font-size: 1.8rem; font-weight: 300; line-height: 1.3; }
    .col-body { font-size: 0.88rem; color: #635F5A; line-height: 1.9; }
    .col-body p + p { margin-top: 16px; }
    .col-body strong { color: var(--text); font-weight: 500; }

    /* CALLOUT */
    .callout { border-left: 2px solid var(--text); padding: 4px 0 4px 24px; margin-top: 40px; }
    .callout .big { font-family: var(--serif); font-size: 1.3rem; line-height: 1.45; color: var(--text); margin-bottom: 12px; }
    .callout p { font-size: 0.85rem; color: #4E4A45; line-height: 1.9; }
    .callout strong { color: var(--text); font-weight: 500; }
    .quote { border-left: 2px solid var(--border); padding-left: 22px; margin-top: 28px; font-family: var(--serif); font-size: 1.08rem; font-style: italic; color: #4E4A45; line-height: 1.7; }

    /* FIGURE */
    .fig { margin-top: 52px; }
    .fig img { width: 100%; display: block; border: 1px solid var(--border-light); background: #fff; }
    .fig figcaption { margin-top: 14px; font-size: 0.76rem; color: var(--muted); line-height: 1.75; }
    .fig.narrow { max-width: 460px; }
    .fig-2 { margin-top: 52px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 34px; align-items: start; }
    .fig-2 figure { margin: 0; }
    .fig-2 img { width: 100%; display: block; border: 1px solid var(--border-light); background: #fff; }
    .fig-2 figcaption { margin-top: 13px; font-size: 0.75rem; color: var(--muted); line-height: 1.7; }

    /* ROUNDS */
    .rounds { margin-top: 44px; border-top: 1px solid var(--border-light); }
    .round { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 34px; padding: 24px 0; border-bottom: 1px solid var(--border-light); align-items: start; }
    .round-n { font-family: var(--serif); font-size: 1.7rem; font-weight: 300; color: var(--light); line-height: 0.9; }
    .round-did { font-size: 0.84rem; color: var(--text); line-height: 1.8; }
    .round-did strong { font-weight: 500; }
    .round-got { font-size: 0.84rem; color: #706C67; line-height: 1.8; }
    .round-got strong { color: var(--text); font-weight: 500; }

    /* BOUNDS */
    .bounds { margin-top: 44px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border-light); border: 1px solid var(--border-light); }
    .bound { background: var(--bg); padding: 26px 30px; }
    .bound-k { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--light); margin-bottom: 10px; }
    .bound-v { font-size: 0.83rem; color: #635F5A; line-height: 1.85; }
    .bound-v strong { color: var(--text); font-weight: 500; }

    /* FOOTER */
    .page-footer { padding: 56px 0; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; }
    .footer-back { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .footer-back:hover { color: var(--text); }
    .footer-copy { font-size: 0.7rem; color: var(--light); }

    @media (max-width: 840px) {
      .container { padding: 0 24px; }
      .two-col, .stats, .bounds, .fig-2 { grid-template-columns: 1fr; }
      .fig-2 { gap: 30px; }
      .fig.narrow { max-width: 100%; }
      .stat { border-right: none; border-bottom: 1px solid var(--border-light); padding: 36px 0; }
      .round { grid-template-columns: 1fr; gap: 8px; }
      .round-n { font-size: 1.2rem; }
      section { padding: 60px 0; }
    }
    ::selection { background: var(--text); color: var(--bg); }
  </style>

    "sec9_head": "我对「内容影响决策」的理解，是在这里长出来的",
    "sec9_p1": "最直接的一条：<strong>用户买的从来不只是那件商品。</strong>他在看故事、看趋势、看社区里别人怎么评价这个球员、这张卡。一个卡贩子只需要知道行价，但要让人下单，你得参与他判断价值的那个过程。这件事后来变成我看内容产品的默认视角——也是我为什么最终去了内容平台做产品。",
    "sec9_p2": "第二条更能迁移到我今天做的事：<strong>不透明的市场需要一把可解释的尺子。</strong>球星卡当年没有公开的定价依据，所以内容、评级分数、成交曲线才有价值。今天的 AI 产品处在同一个位置——用户分不出两个模型谁更好、一个智能体的回答该不该信。<strong>「帮用户建立可解释的判断依据」这件事，和我当年写评级说明书是同一件事。</strong>",
    "sec9_p3": "第三条关于用户动机，也是我当年翻译海外行业报告时最受触动的一段：拆卡包的期望回报大多是负的，为什么还有人一直买？三个理由——<strong>可能一发抽中远超成本的卡、可能随时间升值、可能押中一个还没成名的球员</strong>。这解释了所有带随机奖励的产品为什么成立。<strong>今天我做任何带抽卡、激励、游戏化机制的设计，用的还是这套动机模型。</strong>"
  },
  "en": {
    "back": "Portfolio",
    "foot_back": "← Back to portfolio",
    "hero_meta": "Work experience · Co-founder · Aug 2021 — Jul 2023 · Xi'an, China",
    "hero_title": "Collector Universe",
    "hero_sub": "Nobody publishes what a card is worth — so we built the yardstick ourselves",
    "s1n": "214",
    "s1": "original long-form pieces on our WeChat account. I chose every topic, ran every interview, wrote every word — and that was one platform out of three.",
    "s2n": "79K",
    "s2": "cumulative likes on Douyin, with one video peaking at 15K. I wrote the copy and the scripts; I ran the shoots.",
    "s3n": "2 years",
    "s3": "full-time. From one shop in Xi'an to a business that outgrew the shop — and this is what paid the tuition that took me back to school.",
    "fig1a_cap": "Our Xiaohongshu profile. Those three lines of bio — \"beginner guides, great cards to look at, and the latest market moves\" — are literally how we split our content; the line below places us in Xi'an, where the shop was.",
    "fig1b_cap": "This is the kind of thing that passed through our hands: a Kobe Bryant National Treasures Logoman autograph — the only copy in the world (1/1). An NBA logo cut from a game-worn jersey plus the player's signature is the ceiling of this category.",
    "sec2_label": "My read on it",
    "sec2_head": "This market wasn't short of product. It was short of reasons for a beginner to buy.",
    "sec2_p1": "It became clear quickly that <strong>getting cards was easy; getting a newcomer to trust you was not</strong>. The scene was full of collectors who had been in it for a decade, and they held the information. To buy one card, a beginner has to judge seven things at once: how good this player will become, what makes this product line worth opening, how the parallels rank for scarcity, how much the serial number matters, whether the card is worth grading, which grading company to use, and how to sell it afterwards. <strong>Seven judgements, none of them transparent.</strong>",
    "sec2_p2": "Most of the trade treats that opacity as the margin — <strong>the information gap is the profit</strong>. My read was that the opposite pays better: <strong>show a beginner exactly how the pricing works</strong>, and he will place a first order; and someone who places a first order and finds out you didn't take him for a ride keeps coming back. So content was never marketing to me. It was <strong>removing friction from the transaction</strong>.",
    "fig2_cap": "The Douyin content wall: from what a million-dollar card looks like to signatures, mystery packs, and parallel editions, topics were reverse-engineered from <strong>what beginners most wanted to understand</strong>. The top video reached 15,000 likes.",
    "sec2_co_big": "What a beginner in this scene fears most isn't overpaying. It's being taken for a mark.",
    "sec2_co_p": "Which means trust can't be built on sales talk. It can only be built on \"<strong>I'll make sure you understand it before I sell you anything</strong>\". Every piece of content I went on to make — beginner guides, grading explainers, sale-price round-ups, standards comparisons — was the same move: <strong>taking the information the veterans had cornered and giving it away.</strong>",
    "sec4_label": "The part I most want to explain",
    "sec4_head": "The market had no standard, so I went and asked what it was",
    "sec4_p1": "Second-hand card trading runs on a term everybody uses and nobody has defined: <strong>\"tradeable condition\"</strong> — a card whose condition is normal enough to change hands without argument. Both sides use it, and everybody's line sits somewhere different, so disputes never stop: the seller says it's tradeable, the buyer opens the package and disagrees.",
    "sec4_p2": "I did not simply publish my own opinion. I stacked three types of evidence: <strong>a poll of 230 collectors</strong>, a major marketplace's public condition guide, and a tier-by-tier comparison of third-party authentication standards.",
    "sec4_p3": "Put together, they gave a term that had lived only in veteran intuition a definition that was <strong>accepted by most users, anchored in external standards, and executable by both sides of a trade</strong>.",
    "fig4a_cap": "A community poll with 230 votes, the spread visible at a glance. <strong>Instead of guessing what users thought, I asked them to make the disagreement visible.</strong>",
    "fig4b_cap": "The other half of the material: the trading platform's own condition tiers, seven dimensions (corners, edges, discolouration, creases…) mapped onto four grades. <strong>Put the community's vote next to the official wording and a definition you can actually enforce appears.</strong>",
    "sec4_co_big": "In a market with no authoritative definition, consensus itself is the product.",
    "sec4_co_p": "Looking back, this was <strong>user research plus standard-setting</strong>: quantify where users actually disagree (the vote distribution), anchor it against outside authority (the official tiers), then state a version both sides can live with and act on. <strong>I didn't invent a standard — I wrote down one that already existed and that nobody had written down.</strong> And the person who writes it down becomes the one who gets cited.",
    "sec6_label": "Outcome",
    "sec6_head": "Three platforms, one person's topics and scripts",
    "sec6_p1": "WeChat: <strong>214 original pieces, 2,805 followers</strong>. Douyin: <strong>8,891 followers, 79,000 cumulative likes, top video 15,000</strong>. Xiaohongshu: <strong>2,793 followers, 7,418 likes and saves</strong>. Each channel had a job: WeChat carried depth (grading method, industry structure, auction data), while Douyin and Xiaohongshu did card appreciation, breaks, and reactions to whatever was happening.",
    "sec6_p2": "Topics, copy and video scripts were mine; I coordinated the crew for filming. One source was the inbox — the beginner's guide grew directly from repeated messages from people who wanted to understand sports cards and had no idea where to start.",
    "fig6a_cap": "The account card in the WeChat back end: <strong>214</strong> original pieces, <strong>2,805</strong> total users.",
    "fig6b_cap": "The Douyin profile: <strong>79,000 likes, 8,891 followers</strong>. The bio invites people to come and open packs at the shop — routing online attention to the physical room was the base of the whole business.",
    "fig7b_cap": "The Xiaohongshu grid runs differently — more market read than showcase: \"Harden's lost his magic; are his cards crashing?\", \"How far apart are LaMelo and Morant really?\" <strong>The same material needs a different telling on a different platform.</strong>",
    "sec9_label": "What the two years left me",
    "sec9_head": "Where my sense of \"content drives decisions\" actually came from",
    "sec9_p1": "The most direct lesson: <strong>a buyer is never only buying the object.</strong> He is reading the story, the trend, and what the community thinks of this player and this card. A dealer only needs to know the going rate; but to get someone to buy, you have to be part of how he arrives at what it's worth. That became my default lens on content products — and a large part of why I ended up doing product at a content platform.",
    "sec9_p2": "The second transfers even more cleanly into what I do now: <strong>an opaque market needs a yardstick people can interpret.</strong> Sports cards had no published basis for price, which is exactly why content, grades and sale curves carried value. AI products sit in the same position today — users can't tell which of two models is better, or whether an agent's answer deserves trust. <strong>Helping users build an interpretable basis for judgement is the same job as writing that grading explainer was.</strong>",
    "sec9_p3": "The third is about motivation, and it came from translating an overseas industry report: the expected return on opening a pack of cards is usually negative, so why do people keep buying? Three reasons — <strong>you might pull a card worth many times the box, it might appreciate over time, or you might catch a player before he becomes a star</strong>. That explains why every product built on random rewards works at all. <strong>Whenever I design anything with pulls, incentives or game mechanics today, that's still the motivation model I use.</strong>"
  }

let lang = 'zh';
function applyLang(l) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T[l][el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;
  });
  document.getElementById('lang-btn').textContent = l === 'zh' ? 'EN' : '中文';
  document.documentElement.lang = l === 'zh' ? 'zh' : 'en';
}
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('site_lang', lang);
  applyLang(lang);
}
lang = localStorage.getItem('site_lang') || 'zh';
applyLang(lang);
